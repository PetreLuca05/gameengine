# Performance audit (docs/PERF_AUDIT.md "CI").
#   tools:   every push / PR on a hosted runner: the analyzer's tests (rules on synthetic profiles, the
#            image-diff and state-hash harness), the console registry lint and the static scan.
#   nightly: on the self-hosted Windows runner with the target GPU (labels: self-hosted, windows, gpu):
#            build, the full audit, the all-fixes A/B image + state check, the regression gate (fails
#            when a scene's CPU work or GPU p50 regresses more than 5 % against docs/perf/baseline.json,
#            or when an image / state diff fails); the report and timelines are uploaded as artifacts.
# Runner setup (once): register a runner on the game PC with those labels; give it the portable toolchain
# by setting the repository variable DG_TOOLCHAIN to the folder holding b.sh (the .toolchain the
# developer builds with), then run the workflow once with write_baseline: true.
name: perf-audit

on:
  push:
    paths: ["src/**", "shaders/**", "tools/perf_audit/**", "assets/perf/**", "CMakeLists.txt", ".github/workflows/perf_audit.yml"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      frames:
        description: "frames per scene"
        default: "300"
      write_baseline:
        description: "write docs/perf/baseline.json from this run (no gate)"
        type: boolean
        default: false

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyzer tests (rules, image diff, state hash, verify)
        run: python tools/perf_audit/tests/run_tests.py
      - name: Console registry lint
        run: python tools/tests/lint_commands.py
      - name: Static scan
        run: python tools/perf_audit/perf_audit.py scan

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      PERF_OUT: ${{ github.workspace }}/build/perf_out/nightly
      PERF_SETTLE: "120"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          if [ -z "${{ vars.DG_TOOLCHAIN }}" ]; then echo "set the repository variable DG_TOOLCHAIN (folder with b.sh)"; exit 1; fi
          rm -rf .toolchain && cp -r "${{ vars.DG_TOOLCHAIN }}" .toolchain
          .toolchain/b.sh
      - name: Audit (every scene, Modern + Low, 2-client LAN)
        run: tools/perf_audit/run_audit.sh "${{ github.event.inputs.frames || '300' }}" all
      - name: All fixes A/B (image diff + state hash)
        run: |
          cd build/bin
          printf 'perf_verify all devroom,horde500,night_lights 120 %s reps=1 settle=120 quit\n' "$PERF_OUT/verify" > "$PERF_OUT/verify_all.cfg"
          ./deadground.exe --test --nosound --log "$PERF_OUT/verify_all.log" --script "$PERF_OUT/verify_all.cfg" || true
      - name: Baseline
        if: github.event.inputs.write_baseline == 'true'
        run: python tools/perf_audit/perf_audit.py ci "$PERF_OUT" --write-baseline --machine "$RUNNER_NAME"
      - name: Regression gate
        if: github.event.inputs.write_baseline != 'true'
        run: python tools/perf_audit/perf_audit.py ci "$PERF_OUT" --threshold 5 --verify "$PERF_OUT/verify/all"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-audit-${{ github.run_number }}
          path: |
            docs/perf/AUDIT_*.md
            docs/perf/AUDIT_*.json
            docs/perf/timeline/
            ${{ env.PERF_OUT }}/**/*.json
            ${{ env.PERF_OUT }}/verify/all/diff/
