# Platform builds (docs/PLATFORM_MACOS.md "CI"): macOS arm64 + x86_64 + universal .app, Linux, Windows.
#   every job: configure + build + the headless unit tests; test_detmath's golden hash is the
#              cross-platform determinism check (the same bits on every OS / arch / compiler).
#   linux:     + the vgeo GPU tests on llvmpipe in both visibility write modes, the SPIR-V -> MSL check
#   macos-arm64: + the MSL check compiled to AIR with xcrun metal, the vgeo GPU tests on MoltenVK
#              (the runner's paravirtual Metal device, when it exposes one), the universal build
#              (x86_64 slice under Rosetta), Deadground.app (ad-hoc signed) as an artifact
#   macos-x86_64: native Intel build + tests (no GPU on these runners)
# Tests that also fail on main (content tolerances, llvmpipe culling) run in a separate step that
# reports but does not gate: tools/ci/known_failures.txt.
name: platforms

on:
  push:
    paths-ignore: ["docs/**", "**/*.md", "*.png"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: false   # a newer push queues behind a running check (every result is wanted)

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build glslang-tools spirv-cross mesa-vulkan-drivers libvulkan1 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libudev-dev python3-numpy python3-pil
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: |
          cmake --build build 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Build errors
        if: failure()
        run: |
          grep -E "error[: ]" build.log | grep -v "validity error" | sort -u | head -60
      - name: Tests
        run: ctest --test-dir build --output-on-failure -j 4 -E "$(tools/ci/known_failures.sh linux)"
      - name: vgeo GPU tests, 32-bit visibility writes (MoltenVK's path)
        env:
          DG_VGEO_VIS32: "1"
        run: ctest --test-dir build --output-on-failure -R "vgeo_(raster|stream|skinned|foliage)"
      - name: SPIR-V -> MSL (SPIRV-Cross)
        run: python3 tools/macos/msl_check.py build/bin/shaders
      - name: Known failures (not gating)
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -R "$(tools/ci/known_failures.sh linux)"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan SDK (glslc)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe -OutFile vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList '--root','C:\VulkanSDK','--accept-licenses','--default-answer','--confirm-command','install'
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Python packages (ground texture tests)
        run: python -m pip install numpy pillow
      - name: Configure
        # Visual Studio generator: Jolt's project only has Debug / Release / Distribution configurations;
        # the tests' Python is the one that has numpy / Pillow
        run: cmake -S . -B build -A x64 "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error (C|LNK|MSB)[0-9]+|fatal error" build.log | sort -u | head -60
      - name: Tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure -j 4 -E "$(tools/ci/known_failures.sh windows)"
      - name: Known failures (not gating)
        continue-on-error: true
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure -R "$(tools/ci/known_failures.sh windows)"

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install ninja glslang spirv-cross molten-vk vulkan-loader
      - name: Configure (arm64)
        run: cmake -S . -B build-mac-arm64 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/macos-arm64.cmake
      - name: Python packages (ground texture tests)
        run: python3 -m pip install --break-system-packages numpy pillow || python3 -m pip install numpy pillow
      - name: Build (arm64)
        run: |
          cmake --build build-mac-arm64 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Build errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -60
      - name: Architecture
        run: lipo -info build-mac-arm64/bin/deadground && otool -L build-mac-arm64/bin/deadground
      - name: Tests (arm64)
        run: |
          export VK_ICD_FILENAMES="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"
          ctest --test-dir build-mac-arm64 --output-on-failure -j 3 -E "$(tools/ci/known_failures.sh macos)"
      - name: MoltenVK pipeline diagnostics (vgeo raster, MoltenVK log)
        if: always()
        continue-on-error: true
        run: |
          export VK_ICD_FILENAMES="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib"
          cd build-mac-arm64/bin && MVK_CONFIG_LOG_LEVEL=3 ./test_vgeo_raster 2>&1 | grep -iE "mvk|error|fail|compil|harness" | head -80
      - name: SPIR-V -> MSL -> AIR (SPIRV-Cross + xcrun metal)
        if: always()
        run: |
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain || true
          python3 tools/macos/msl_check.py build-mac-arm64/bin/shaders --out msl --metal
      - name: Known failures (not gating)
        continue-on-error: true
        run: ctest --test-dir build-mac-arm64 --output-on-failure -R "$(tools/ci/known_failures.sh macos)"
      - name: Universal build (x86_64 slice under Rosetta)
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          ARCHS="arm64 x86_64" tools/macos/build_universal.sh RelWithDebInfo -DDG_DISTRIBUTION=ON
      - name: Universal MoltenVK
        run: |
          curl -sSL -o mvk.tar https://github.com/KhronosGroup/MoltenVK/releases/latest/download/MoltenVK-macos.tar
          tar -xf mvk.tar
          find MoltenVK -name libMoltenVK.dylib -path "*dynamic*" | head -1 > mvk_path.txt
          lipo -info "$(cat mvk_path.txt)"
      - name: Deadground.app (ad-hoc signed)
        run: |
          tools/macos/make_bundle.sh build-mac-universal/bin dist --moltenvk "$(cat mvk_path.txt)" --build "${{ github.run_number }}"
          tools/macos/sign.sh dist/Deadground.app
          lipo -info dist/Deadground.app/Contents/MacOS/deadground
      - uses: actions/upload-artifact@v4
        with:
          name: Deadground-macos-universal
          path: dist/Deadground.app
          retention-days: 14

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install ninja glslang spirv-cross
      - name: Configure (x86_64)
        run: cmake -S . -B build-mac-x86_64 -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/macos-x86_64.cmake
      - name: Python packages (ground texture tests)
        run: python3 -m pip install --break-system-packages numpy pillow || python3 -m pip install numpy pillow
      - name: Build (x86_64)
        run: |
          cmake --build build-mac-x86_64 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Build errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -60
      - name: Architecture
        run: lipo -info build-mac-x86_64/bin/deadground
      - name: Tests (x86_64)
        run: ctest --test-dir build-mac-x86_64 --output-on-failure -j 3 -E "$(tools/ci/known_failures.sh macos)"
      - name: Known failures (not gating)
        continue-on-error: true
        run: ctest --test-dir build-mac-x86_64 --output-on-failure -R "$(tools/ci/known_failures.sh macos)"
