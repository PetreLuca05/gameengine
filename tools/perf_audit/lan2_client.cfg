// perf_audit 2-client LAN scene, client side (joined with +connect 127.0.0.1). The host waits for this
// client (net_wait_clients), then both settle 240 frames and capture the same window.
r_maxfps 0
r_vsync 0
dev_fixed_fps 60
wait 240
prof_capture @FRAMES@ @OUT@/lan2_client.json lan2_client 30 lan2_client
wait @FRAMES@
wait 60
quit
