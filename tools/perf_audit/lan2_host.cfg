// perf_audit 2-client LAN scene, host side (tools/perf_audit/run_audit.sh fills @OUT@ / @FRAMES@).
r_maxfps 0
r_vsync 0
dev_fixed_fps 60
time_set 12:00
time_pause 1
weather_lock 1
weather_set clear 0
setpos 0 0 62
spawn_horde 300 30 ring
horde_target point 0 0 50
wait 420
prof_capture @FRAMES@ @OUT@/lan2_host.json lan2_host 30 lan2_host
wait @FRAMES@
wait 120
quit
