// Aim accuracy (docs/AIM.md "Hold aim"): the rifle at the ballistics range gongs (25 m from the firing
// point, 100 / 300 m from 1 m aside: from the point itself the 25 m gong hides them; 2 / 5 m in front of
// the 25 m gong), hip, ADS irons and ADS red dot, no spread. Every case clear, the crosshair exactly at
// the screen centre, the shot along the gameplay pose's barrel, the impact on P within max(1 cm, 0.01 %
// of D) without ballistics; with ballistics (bal_enable 1, no wind, no spin drift) the impact's height
// above P is the zero / drop path. One block per mode x distance, ballistics off then on.
// Check: python3 tools/tests/aim_check.py <log> --accuracy
set dev_fixed_fps 60
set r_maxfps 60
wait 90
time_pause 1
time_set 13:00
weather_set clear
infinite_ammo
set aim_debug 2
set ballistics_debug 2
set wpn_spread_scale 0
set bal_wind 0
set bal_spin_drift 0
give rifle
wait 5
wield rifle
set bal_enable 0
attach optic none
wait 20
echo aim_case hip_2
setpos 54.71 0.05 -40 -90 0
wait 5
lookat 57.000 1.600 -40.000
wait 30
aim_report
crosshair_pos
+attack
wait 1
-attack
wait 40
echo aim_case hip_5
setpos 51.71 0.05 -40 -90 0
wait 5
