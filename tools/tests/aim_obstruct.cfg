// Aim model (docs/AIM.md) on the dev room aim stand (x 104..128, z 40): every case logs aim_report
// (P, muzzle, origin, Q, class, Q's screen position) and crosshair_pos (where the HUD drew the
// crosshair), then fires one shot (aim_debug 2 logs its class). tools/tests/aim_check.py checks the
// log: deadground --test --nosound --log aim.log --script tools/tests/aim_obstruct.cfg
//         python3 tools/tests/aim_check.py aim.log
set dev_fixed_fps 60
set r_maxfps 60
wait 90
time_pause 1
time_set 13:00
infinite_ammo
set aim_debug 2
set crosshair_obstruct 1
set crosshair_obstruct_lerp 0.1
give rifle
wait 5
slot 1
attach optic none
// The camera ray starts at the first-person camera (the head socket): standing ~1.66 m, crouched
// ~1.28 m; the hip muzzle sits ~0.12 m below it, ~0.09 m right, ~0.72 m ahead. Every lookat waits
// for the setpos before it (lookat aims from the current camera).
// 1. Open field, hip: clear, the crosshair on P.
echo aim_case open_hip
setpos 100 0.05 41.5 0 0
wait 5
lookat 100 1.5 25
wait 60
aim_report
crosshair_pos
screenshot shots/aim/open_hip.png
wait 2
// 2. Open field, ADS: clear, the muzzle almost on the camera axis.
echo aim_case open_ads
+aim
wait 40
aim_report
crosshair_pos
-aim
wait 30
// 3. Wall edge: the eye sees past the edge, the hip muzzle is behind it (partial).
echo aim_case wall_edge
setpos 104.04 0.05 41.5 0 0
wait 5
lookat 104.04 1.3 25
wait 60
aim_report
crosshair_pos
screenshot shots/aim/wall_edge.png
wait 2
+attack
wait 1
-attack
wait 20
// 4. Barrel against the wall: blocked at the barrel.
echo aim_case barrel
setpos 105.6 0.05 40.75 0 0
wait 5
lookat 105.6 1.4 30
wait 60
aim_report
crosshair_pos
screenshot shots/aim/barrel.png
wait 2
+attack
wait 1
-attack
wait 20
// 5. Barrel blocked with block_fire_when_barrel_blocked: no shot (aim_stats counts it).
echo aim_case barrel_rule
set block_fire_when_barrel_blocked 1
+attack
wait 3
-attack
wait 10
set block_fire_when_barrel_blocked 0
aim_stats
// 6. Window frame, crouched: the camera clears the sill (1.22 m), the barrel does not.
echo aim_case window_crouch
setpos 110 0.05 41.2 0 0
+crouch
wait 40
lookat 110 1.2 25
wait 30
aim_report
crosshair_pos
screenshot shots/aim/window_crouch.png
wait 2
-crouch
wait 30
// 7. Low wall (1.22 m cover), crouched.
echo aim_case low_wall
setpos 122 0.05 41.0 0 0
+crouch
wait 40
lookat 122 1.2 25
wait 30
aim_report
crosshair_pos
screenshot shots/aim/low_wall.png
wait 2
-crouch
wait 30
// 8. Thin wall: the muzzle pokes through it (origin recovered in front of the wall).
echo aim_case thin_wall
setpos 128 0.05 41.05 0 0
wait 5
lookat 128 1.45 25
wait 60
aim_report
crosshair_pos
+attack
wait 1
-attack
wait 20
// 9. Car bodywork, crouched at the cabin's corner: the camera sees past the A pillar, the barrel
// (right of it) is behind the bodywork.
echo aim_case car
setpos 115.0 0.05 42.4 0 0
+crouch
wait 40
lookat 115.0 1.25 25
wait 30
aim_report
crosshair_pos
screenshot shots/aim/car.png
wait 2
-crouch
wait 30
// 10. A teammate in the line of fire: friendly.
echo aim_case friendly
setpos 100 0.05 41.5 0 0
wait 5
lookat 100 1.5 25
wait 10
spawn_teammate aimbuddy 1.2
wait 60
// the camera ray just left of the teammate's head, the barrel (9 cm right of it) through the head
setpos 99.87 0.05 41.5 0 0
wait 5
lookat 99.87 1.6 25
wait 30
aim_report
crosshair_pos
screenshot shots/aim/friendly.png
wait 2
aim_stats
quit
