// Aim model (docs/AIM.md) on the dev room aim stand (x 104..128, z 40): every case logs aim_report
// (P, muzzle, origin, the barrel line's end Q, class, Q's screen position, the rule's far / margin,
// the hold aim's turn / miss / pull) and crosshair_pos (where the HUD drew the crosshair); most fire
// one shot (aim_debug 2 logs its class, origin, direction, the pose's barrel and the impact: the shot
// follows the barrel of the gameplay pose, never anything else). tools/tests/aim_check.py checks the
// log: deadground --test --nosound --log aim.log --script tools/tests/aim_obstruct.cfg
//         python3 tools/tests/aim_check.py aim.log
set dev_fixed_fps 60
set r_maxfps 60
wait 90
time_pause 1
time_set 13:00 instant
infinite_ammo
set aim_debug 2
set crosshair_obstruct 1
set crosshair_obstruct_lerp 0.1
// No spread: each shot lands exactly on its line (the impact checks).
set wpn_spread_scale 0
// The geometry cases run without the drawn gun's sway (it never moves a bullet or the crosshair:
// the *_centre cases at the end turn it on to show that).
set wpn_sway_scale 0
set cl_weapon_sway 0
give rifle
wait 5
slot 1
attach optic none
// The camera ray starts at the first-person camera (the head socket): standing ~1.66 m, crouched
// ~1.28 m, ~0.28 m ahead of the setpos point; the hip muzzle sits ~0.12 m below it, ~0.09 m right,
// ~0.72 m ahead, and the hold turns the gun so its barrel line passes through P. Every lookat
// waits for the setpos before it (lookat aims from the current camera).
// 1. Hip at the target panel 16 m down range (over the low wall): the barrel line ends at P: clear,
// the crosshair exactly at the screen centre; the shot lands on P.
echo aim_case open_hip
setpos 122 0.05 41.5 0 0
wait 5
lookat 122 1.4 25
wait 60
aim_report
crosshair_pos
screenshot shots/aim/open_hip.png
wait 2
+attack
wait 1
-attack
wait 20
// 2. Open field, ADS: clear, the gun turned about the sight so the bore line passes through P.
echo aim_case open_ads
setpos 100 0.05 41.5 0 0
wait 5
lookat 100 1.5 25
wait 30
+aim
wait 40
aim_report
crosshair_pos
screenshot shots/aim/open_ads.png
wait 2
+attack
wait 1
-attack
wait 20
-aim
wait 30
// 3. Wall edge up close: the camera ~4 cm left of the wall's edge (x 104.1) 1.35 m away sees the
// panel 16 m down range; the hip barrel line (aimed at that P, ~9 cm right of the camera ray there)
// hits the wall: obstructed, the crosshair on Q (settled: 0.5 s; the idle head drift is ~2 cm).
echo aim_case wall_edge
setpos 104.026 0.05 41.78 0 0
wait 5
lookat 104.06 1.4 25
wait 30
aim_report
crosshair_pos
screenshot shots/aim/wall_edge.png
wait 2
+attack
wait 1
-attack
wait 20
// 4. Barrel against the wall: blocked at the barrel.
echo aim_case barrel
setpos 105.6 0.05 40.75 0 0
wait 5
lookat 105.6 1.4 30
wait 60
aim_report
crosshair_pos
screenshot shots/aim/barrel.png
wait 2
+attack
wait 1
-attack
wait 20
// 5. Barrel blocked with block_fire_when_barrel_blocked: no shot (aim_stats counts it).
echo aim_case barrel_rule
set block_fire_when_barrel_blocked 1
+attack
wait 3
-attack
wait 10
set block_fire_when_barrel_blocked 0
aim_stats
// 6. Pushed against the wall to the max (pull ~1): the hold aim is faded out, the barrel pitched up
// by the pull; the bullet follows that barrel (never a point above it), the crosshair moves to Q.
// holdpoint_static 1: the drawn gun (no sway / kick) is exactly the barrel the bullet follows.
echo aim_case wall_push_max
setpos 105.6 0.05 40.75 0 0
wait 5
lookat 105.6 1.4 30
wait 10
+forward
wait 60
aim_report
crosshair_pos
screenshot shots/aim/wall_push_max.png
wait 2
+attack
wait 1
-attack
wait 10
set holdpoint_static 1
wait 10
echo aim_case wall_push_static
aim_report
crosshair_pos
set holdpoint_static 0
-forward
wait 10
// 6b. The obstruction clears: a step back from the same wall (3 m, face on) the barrel line ends
// at P on the wall: clear, the crosshair back at the centre.
echo aim_case clear_again
setpos 105.6 0.05 43.0 0 0
wait 5
lookat 105.6 1.4 40
wait 60
aim_report
crosshair_pos
// 7. Partial clear: 0.95 m from the wall (P past the hold aim's 12 deg, the wall collision not yet
// pulling) the line misses P: obstructed, the crosshair on Q; back at 3 m it returns to the centre,
// monotonically, and is exactly the centre once settled.
echo aim_case partial_clear
setpos 105.6 0.05 41.38 0 0
wait 5
lookat 105.6 1.4 30
wait 40
aim_report
crosshair_pos
setpos 105.6 0.05 43.43 0 0
echo aim_case partial_clear_back
wait 3
crosshair_pos
wait 3
crosshair_pos
wait 6
crosshair_pos
wait 48
aim_report
crosshair_pos
// 8. 1.3 m from the wall with the hold aim limited to 6 deg (wpn_hold_aim_max, a host rule; the
// default 12 reaches P down to ~1 m): P needs ~8.5 deg, nothing pulls the gun, the line misses P by a
// few cm and lands on the wall beside it: obstructed by the miss, the crosshair on Q.
set wpn_hold_aim_max 6
echo aim_case near_unreached
setpos 105.6 0.05 41.73 0 0
wait 5
lookat 105.6 1.4 30
wait 40
aim_report
crosshair_pos
screenshot shots/aim/near_unreached.png
wait 2
+attack
wait 1
-attack
wait 20
set wpn_hold_aim_max 12
// 9. The ground ~15 m ahead: the barrel line goes through P on the ground (it reaches the ground
// there and nowhere sooner): clear by construction.
echo aim_case ground_ahead
setpos 100 0.05 41.5 0 0
wait 5
lookat 100 0 27
wait 40
aim_report
crosshair_pos
+attack
wait 1
-attack
wait 20
lookat 100 1.5 25
wait 20
// 10. Window frame, crouched: the camera clears the sill (1.22 m), the barrel does not.
echo aim_case window_crouch
setpos 110 0.05 41.2 0 0
+crouch
wait 40
lookat 110 1.2 25
wait 30
aim_report
crosshair_pos
screenshot shots/aim/window_crouch.png
wait 2
-crouch
wait 30
// 11. Low wall (1.22 m cover), crouched.
echo aim_case low_wall
setpos 122 0.05 41.0 0 0
+crouch
wait 40
