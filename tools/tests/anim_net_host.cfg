// Animation network test (host). Run with anim_net_client.cfg (+connect 127.0.0.1), see docs/ANIMATION_NET.md.
set cl_name AnimHost
set anim_net_debug 1
wait 60
char_spawn zombie_runner 2 0 18 0
char_spawn player 4.5 0 18 0 rifle
char_spawn zombie_brute -0.5 0 18.5 0
setpos -3 0 26 -30 0
wait 200
give rifle 1 1
give ammo_rifle 120 1
wait 450
char_list
aimat chest
wait 2
char_kill
wait 200
char_list
wait 200
quit
