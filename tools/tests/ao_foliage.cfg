// AO foliage corner (dev room, docs/RENDERING_POST.md "Foliage-aware AO"): lit, raw / blurred / final AO,
// AO off, then a slow strafe for flicker (r_post_debug 1 frames, compare consecutive shots).
// Run: deadground --test --nosound --validation --log ao.log --script ../../tools/tests/ao_foliage.cfg
r_maxfps 60
wait 15
setpos -50 0.05 -26.0 0 -10
wait 30
screenshot ao_foliage_lit.png
wait 2
r_post_debug 18
wait 4
screenshot ao_foliage_raw.png
wait 2
r_post_debug 19
wait 4
screenshot ao_foliage_blur.png
wait 2
r_post_debug 20
wait 4
screenshot ao_foliage_final.png
wait 2
r_post_debug 0
r_ao 0
wait 6
screenshot ao_foliage_noao.png
wait 2
r_ao 2
r_post_debug 1
setpos -51 0.05 -27.0 10 -10
wait 30
screenshot ao_foliage_move0.png
wait 2
setpos -50.96 0.05 -27.0 10 -10
wait 1
screenshot ao_foliage_move1.png
wait 2
setpos -50.92 0.05 -27.0 10 -10
wait 1
screenshot ao_foliage_move2.png
wait 2
quit
