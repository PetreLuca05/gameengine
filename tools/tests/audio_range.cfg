// Procedural audio on the dev room audio range (docs/AUDIO_PROCEDURAL.md "Audio range"): the room
// estimate in the reverb corridor, the cliff echo at the pad, recipes of every family playing through
// the environment chain (snd_trace logs each voice's delay / gain / occlusion / zone). The mixer runs
// offline under --nosound. tools/tests/audio_range_check.py checks the log:
//   deadground --test --nosound --log audio.log --script tools/tests/audio_range.cfg
//   python3 tools/tests/audio_range_check.py audio.log
set dev_fixed_fps 60
set r_maxfps 60
wait 3
time_pause 1
set snd_trace 1
setpos -260 0 -170 90
wait 3
audio_env_probe
audio_synth_play gunshot energy=2000 at=-262,1.5,-170
wait 2
setpos -230 0 -230 270
wait 3
audio_env_probe
audio_synth_play gunshot energy=2000 at=-230,1.5,-231
wait 2
audio_synth_play impact material=4 energy=900 at=-215,1.2,-200
audio_synth_play footstep material=9 speed=4 at=-229,0,-232
audio_synth_play zombie_voice call=1 at=-222,1.6,-236
audio_synth_play vehicle_engine rpm=3000 throttle=0.6 at=-200,0.5,-250
audio_synth_play thunder strike=1200 at=-900,600,-230
audio_synth_play ui_click
wait 3
audio_voices
wait 30
audio_voices
// The sound test bay in the hall: the tiled room, a footstep on the gravel strip, a shot at the
// metal panel, a voice behind the plaster panel (occluded), the car's engine.
setpos 32 0 -14.5 90
wait 3
audio_env_probe
audio_synth_play gunshot energy=2000 at=33,1.5,-14.5
wait 2
setpos 13 0 -9.5 0
wait 3
audio_env_probe
audio_synth_play footstep material=9 speed=4 at=13,0.05,-10
audio_synth_play impact material=5 energy=1500 at=11,1.2,-15.95
audio_synth_play zombie_voice call=0 at=9,1.2,-17
audio_synth_play vehicle_engine rpm=2500 at=18,0.6,-3 self=2.8
wait 3
audio_voices
// Recorded CC0 takes (assets/audio/sample_sources.json) under the synthesized layers: a footstep on
// the concrete strip, a metal and a glass impact, a zombie scream, a ricochet.
audio_synth_play footstep material=1 speed=3 at=13,0.05,-10
audio_synth_play impact material=4 energy=900 @impact_metal at=11,1.2,-12
audio_synth_play impact material=11 energy=400 @impact_glass at=15,1.2,-12
audio_synth_play zombie_voice call=2 at=9,1.6,-8
audio_synth_play ricochet at=16,1,-9
wait 3
quit
