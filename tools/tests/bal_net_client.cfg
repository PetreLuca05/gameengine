// Ballistics LAN test, client (tools/tests/bal_net.sh): predicts its own pistol shots at the dummy
// (host confirms them), then stands beside the host's line of fire to hear the cracks / reports.
r_maxfps 60
ballistics_debug 2
snd_trace 1
wait 360
slot 1
setpos -14 0.05 34 0 0
wait 40
lookat -14 1.3 24
+aim
wait 30
+attack
wait 3
-attack
wait 30
setpos -17 0.05 27 0 0
lookat -9 1.3 30
wait 900
quit
