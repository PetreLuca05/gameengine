// Ballistics LAN test, client (tools/tests/bal_net.sh): predicts its own pistol shots at the dummy
// (host confirms them), then stands beside the host's line of fire to hear the cracks / reports.
r_maxfps 60
ballistics_debug 2
snd_trace 1
wait 360
set net_fakelag 100
set aim_debug 2
wait 60
slot 4
setpos -14 0.05 34 0 0
wait 40
lookat -14 1.3 24
+aim
wait 30
+attack
wait 3
-attack
wait 30
// Hip fire: the hold aim points the barrel at the dummy; the host's impacts must still agree.
-aim
wait 30
+attack
wait 3
-attack
wait 30
// Close range hip shots (the hold aim's biggest turns): walk up to the dummy (a client cannot setpos)
// and fire with the barrel against it, then once more a few metres off; the claims, aimed at the
// client's own P, are within tolerance of the host's pose re-aimed at its P (no barrel clamps).
lookat -14 1.3 24
wait 5
+forward
wait 130
-forward
wait 40
lookat -14 1.3 24
wait 20
+attack
wait 3
-attack
wait 30
+forward
wait 20
-forward
wait 40
lookat -14 1.3 24
wait 20
+attack
wait 3
-attack
wait 30
setpos -17 0.05 27 0 0
lookat -9 1.3 30
wait 1500
quit
