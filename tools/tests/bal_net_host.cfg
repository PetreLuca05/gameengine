// Ballistics LAN test, host (tools/tests/bal_net.sh): gives the client a pistol, fires a rifle burst
// past the client (cracks on the client, replayed tracers), logs every authoritative hit.
r_maxfps 60
ballistics_debug 2
snd_trace 1
sv_infinite_ammo 1
fire_tracers_only 1
time_pause 1
time_set 13:00
wait 120
give pistol 1 1
wait 120
give pistol 1 1
give rifle
slot 1
setpos -10 0.05 32 0 0
wait 500
lookat -14 1.3 24
+aim
wait 30
+attack
wait 3
-attack
wait 400
quit
