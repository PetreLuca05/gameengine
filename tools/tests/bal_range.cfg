wait 3
+attack
wait 1
-attack
wait 20
lookat 47 1.2 -59.5
wait 3
+attack
wait 1
-attack
wait 20
lookat 47 1.2 -60.5
wait 3
+attack
wait 1
-attack
wait 20
wield sniper
wait 30
lookat 47 1.3 -51.5
wait 3
+attack
wait 1
-attack
wait 40
lookat 47 1.3 -53.5
wait 3
+attack
wait 1
-attack
wait 40
lookat 47 1.3 -58.5
wait 3
+attack
wait 1
-attack
wait 40
setpos 49 0.05 -56 90 0
wait 10
lookat 47.6 1.0 -56
wait 10
screenshot ../../screenshots/ballistics/penetration_witness.png
wait 3
bal_info
quit
