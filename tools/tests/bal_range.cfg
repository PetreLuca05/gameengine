// Ballistics range (docs/BALLISTICS.md "Tests"): day and night muzzle flashes per device
// (muzzle_preview), tracers in slow motion, grazing hits (no ricochet), penetration stacks,
// ballistics_debug.
// Run from build/bin with --test (+ --validation): screenshots land in screenshots/ballistics of
// the source tree (../../screenshots/ballistics from build/bin). Expect 0 validation messages; the log has every hit
// (ballistics_debug 2) and the sound timing (snd_trace).
r_maxfps 60
wait 30
time_pause 1
time_set 13:00 instant
weather_set clear
ballistics_debug 2
snd_trace 1
sv_infinite_ammo 1
give rifle
give sniper
give pistol
wield rifle
bal_range
wait 40
lookat 332 1.6 -40
wait 10
screenshot ../../screenshots/ballistics/range_overview_day.png
wait 3
// Muzzle flash per device, seen from the side, day (exposure-aware: faint).
vfx_clear
wait 2
muzzle_preview rifle bare 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_day_bare.png
wait 4
vfx_clear
wait 2
muzzle_preview rifle flash_hider 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_day_hider.png
wait 4
vfx_clear
wait 2
muzzle_preview rifle compensator 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_day_comp.png
wait 4
vfx_clear
wait 2
muzzle_preview rifle suppressor 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_day_suppressor.png
wait 4
muzzle_preview off
// Night: the same flashes dominate.
time_set 23:30 instant
wait 60
vfx_clear
wait 2
muzzle_preview rifle bare 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_night_bare.png
wait 4
vfx_clear
wait 2
muzzle_preview rifle flash_hider 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_night_hider.png
wait 4
vfx_clear
wait 2
muzzle_preview rifle compensator 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_night_comp.png
wait 4
vfx_clear
wait 2
muzzle_preview rifle muzzle_brake 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_night_brake.png
wait 4
vfx_clear
wait 2
muzzle_preview rifle suppressor 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_night_suppressor.png
wait 4
vfx_clear
wait 2
muzzle_preview pistol bare 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_night_pistol.png
wait 4
vfx_clear
wait 2
muzzle_preview sniper bare 0.02
wait 2
screenshot ../../screenshots/ballistics/flash_night_sniper.png
wait 4
muzzle_preview off
// Tracers at night, slow motion, at the 300 m gong (with the realistic dim igniter start).
bal_tracer_ignition 1
fire_tracers_only 1
host_timescale 0.06
lookat 332 1.9 -40
+aim
wait 30
+attack
wait 40
-attack
wait 2
screenshot ../../screenshots/ballistics/tracers_night_1.png
wait 8
screenshot ../../screenshots/ballistics/tracers_night_2.png
wait 14
screenshot ../../screenshots/ballistics/tracers_night_3.png
wait 3
host_timescale 1
-aim
wait 60
// A tracer that stops within one tick (the floor 8 m ahead, from the hip) is drawn up to the
// impact, not lost before the first frame. Arcade ignition and a 1/60 s shutter show the whole path;
// one of the screenshots falls between the hit and the next tick.
bal_tracer_ignition 0
shutter_preview 0.0167
lookat 40 0 -40
wait 10
host_timescale 0.05
wait 5
+attack
wait 10
screenshot ../../screenshots/ballistics/tracer_stop_1.png
wait 10
screenshot ../../screenshots/ballistics/tracer_stop_2.png
wait 10
screenshot ../../screenshots/ballistics/tracer_stop_3.png
-attack
wait 2
host_timescale 1
shutter_preview 0
bal_tracer_ignition 0
wait 30
fire_tracers_only 0
// Grazing hits by day: the ground at ~3 and ~1.5 deg. Bullets never ricochet: the log
// (ballistics_debug 2) shows only "stop" / "penetrate" outcomes.
time_set 13:00 instant
wait 40
wield sniper
wait 30
+aim
wait 30
lookat 62 0 -40
wait 5
+attack
wait 2
-attack
wait 40
lookat 92 0 -40
wait 5
+attack
wait 2
-attack
wait 30
-aim
wait 5
screenshot ../../screenshots/ballistics/grazing_hits.png
wait 3
// Penetration stacks: rifle (5.56) then sniper (7.62x51) through every stack.
bal_range pen
wait 30
wield rifle
wait 30
