// blender_open (src/game/game_blender.c, docs/ITEM_PIPELINE.md "Open models in Blender"): the command lines
// it builds, then two real runs that never open a window (--list, --no-open on an up-to-date item) whose
// output must come back into the log. Never opens the Blender GUI.
r_maxfps 60
wait 10
blender_open dry all
blender_open dry rifle
blender_open dry all --kind weapon,attachment
blender_open dry list
blender_open list --kind character
wait 240
blender_open rifle --no-open
wait 600
quit
