// Inventory character preview + worn gear (docs/CHARACTERS.md "Character preview", "Worn gear").
// Dev room at noon, the local player in first person. Captures (build/bin):
//   char_preview_fp_off / _rendered / _off2   the main view with the preview off, rendered every frame but
//                                             not shown, off again: the first-person view must not change
//   char_preview_noon / _midnight / _rain     the preview at noon, midnight and in a storm, its pose held
//                                             still (char_preview_show 3): the studio rig makes them the same
//   char_preview_gear_front / _side / _back   helmet + plate carrier + hiking pack, the preview turned
//   char_preview_rifle                        a held rifle (the low ready), no gear
//   char_preview_tp_front / _side / _back     the gear on a teammate in the world (third person views)
//   char_preview_tp_self                      the own gear in third person
// char_preview_check logs PASS / FAIL: the live player's CharacterInst (pose, pose_version, item, part
// cache), its poses and the render camera before / after the preview call are bit-identical.
// Run from build/bin:
//   ./deadground --test --nosound --log <log> --script ../../tools/tests/char_preview.cfg
//   python ../../tools/tests/char_preview_check.py . <log>
r_maxfps 60
dev_fixed_fps 60
weather_lock 1
weather_set clear 0
time_pause 1
time_set 12:00 instant
wait 30
setpos 0 0 12 0 0
wait 30
screenshot char_preview_fp_off.png
wait 2
char_preview_show 2
wait 10
screenshot char_preview_fp_rendered.png
wait 2
char_preview_check
wait 2
char_preview_show 0
wait 10
screenshot char_preview_fp_off2.png
wait 2
char_preview_show 3
wait 20
screenshot char_preview_noon.png
wait 2
time_set 00:00 instant
wait 20
screenshot char_preview_midnight.png
wait 2
weather_set storm 0
wait 40
screenshot char_preview_rain.png
wait 2
char_preview_check
wait 2
weather_set clear 0
time_set 12:00 instant
char_worn helmet plate_carrier backpack_hiking
char_preview_show 1
wait 20
screenshot char_preview_gear_front.png
wait 2
char_preview_show 1 0 0 90
wait 10
screenshot char_preview_gear_side.png
wait 2
char_preview_show 1 0 0 180
wait 10
screenshot char_preview_gear_back.png
wait 2
char_worn none none none
char_preview_show 1 0 0 0 rifle
wait 30
screenshot char_preview_rifle.png
wait 2
char_preview_check
wait 2
char_preview_show 0
spawn_teammate Alex 2.5
wait 10
char_worn helmet plate_carrier backpack_hiking 1
char_worn helmet plate_carrier backpack_hiking
wait 30
screenshot char_preview_tp_front.png
wait 2
setpos 2.5 0 9.5 90 0
wait 20
screenshot char_preview_tp_side.png
wait 2
setpos 0 0 7 180 0
wait 20
screenshot char_preview_tp_back.png
wait 2
setpos 0 0 12 180 0
cl_thirdperson 1
wait 30
screenshot char_preview_tp_self.png
wait 2
cl_thirdperson 0
quit
