// Clavicles keep the clip (docs/ANIMATION.md "Procedural post-pass"): rifle and pistol, hip and ADS,
// first person (anim_clavicle_check: post-pass pose vs the clip + this frame's first-person hold /
// IK pass) and third person screenshots of the shoulders. Every anim_clavicle_check line must end
// "-> PASS": deadground --test --nosound --log clav.log --script tools/tests/clavicle_check.cfg
set dev_fixed_fps 60
set r_maxfps 60
wait 90
time_pause 1
time_set 13:00
setpos 0 0.05 22 0 0
give rifle
give pistol
wait 5
slot 1
wait 60
anim_clavicle_check
+aim
wait 60
anim_clavicle_check
-aim
slot 2
wait 60
anim_clavicle_check
+aim
wait 60
anim_clavicle_check
-aim
wait 20
set cl_thirdperson 1
slot 1
wait 60
anim_clavicle_check
screenshot shots/clav/rifle_hip_tp.png
wait 2
+aim
wait 60
anim_clavicle_check
screenshot shots/clav/rifle_ads_tp.png
wait 2
-aim
slot 2
wait 60
anim_clavicle_check
screenshot shots/clav/pistol_hip_tp.png
wait 2
+aim
wait 60
anim_clavicle_check
screenshot shots/clav/pistol_ads_tp.png
wait 2
-aim
quit
