// Join handshake (docs/SETTINGS_AUDIT.md): a console host for consistency_net.sh; the clients join,
// one with the same locked values (welcomed), one with an edited one (rejected). The server rule
// r_foliage_density 0.6 reaches the welcomed client (MSG_CVARS).
r_maxfps 60
sv_rule r_foliage_density 0.6
host lan
wait 700
quit
