// Frame time of devroom_vegetation against vegetation (docs/ZOMBIE_MAP.md "Level includes"): fixed
// camera stops, uncapped (like perf_compare.cfg); read the "perf_stop <label>" lines. Run from build/bin:
//   ./deadground.exe --test --nosound --log perf.log --script ../../tools/tests/devroom_veg_perf.cfg
set r_maxfps 0
set r_vsync 0
set cl_fp_body 0
set cl_camera_socket 0

// ---------------------------------------------------------------- map vegetation
map vegetation
wait 30
time_set 13:00
time_pause
wait 200
setpos 0 14.7 60 0 0
wait 120
perf_stop 300 veg_spawn
wait 310
setpos -100 17 -80 300 -5
wait 120
perf_stop 300 veg_pine_forest
wait 310
setpos 0 200 260 0 -38
wait 1
noclip
wait 120
perf_stop 300 veg_aerial
wait 310

// ---------------------------------------------------------------- map devroom_vegetation
map devroom_vegetation
wait 30
time_set 13:00
time_pause
wait 200
setpos 0 0.05 24 0 0
wait 120
perf_stop 300 dveg_hall
wait 310
setpos 0 0.05 50 0 0
wait 120
perf_stop 300 dveg_horde_yard
wait 310
setpos 32 0.05 -8 -90 0
wait 120
perf_stop 300 dveg_sighting_lane
wait 310
setpos -110 0.05 -120 330 -5
wait 120
perf_stop 300 dveg_pine_forest
wait 310
setpos 0 200 260 0 -38
wait 1
noclip
wait 120
perf_stop 300 dveg_aerial
wait 310

// ---------------------------------------------------------------- map devroom (reference)
map devroom
wait 30
time_set 13:00
time_pause
wait 200
setpos 0 0.05 24 0 0
wait 120
perf_stop 300 dev_hall
wait 310
quit
