// devroom_vegetation (docs/ZOMBIE_MAP.md "Level includes"): the dev room's areas in the vegetation
// valley, one screenshot each, plus overviews from above. Run with the map on the command line:
//   deadground --test --nosound --log tour.log +map devroom_vegetation --script ../../tools/tests/devroom_veg_tour.cfg
// (with the default map it shows the same spots in the plain dev room, for comparison).
set dev_fixed_fps 60
set r_maxfps 60
set r_motion_blur 0
wait 90
time_pause 1
time_set 13:00
set cl_camera_socket 0
set cl_fp_body 0
// the hall from the spawn, facing north
setpos 0 0.05 24 0 0
wait 120
screenshot shots/dveg/hall.png
wait 2
// the sighting lane from its firing point and the ballistics range, facing east
setpos 32 0.05 -8 -90 0
wait 90
screenshot shots/dveg/sighting_lane.png
wait 2
setpos 32 0.05 -40 -90 0
wait 60
screenshot shots/dveg/ballistics.png
wait 2
// 100 zombies in the horde yard
setpos 0 0.05 50 0 0
wait 10
spawn_horde 100
wait 120
// from the air (setpos walks: noclip after each)
setpos 0 14 92 0 -28
wait 1
noclip
wait 60
screenshot shots/dveg/horde.png
wait 2
zombie_clear
setpos -100 12 30 60 -22
wait 1
noclip
wait 60
screenshot shots/dveg/vehicle_yard.png
wait 2
setpos 80 6 -66 0 -20
wait 1
noclip
wait 90
screenshot shots/dveg/water_pool.png
wait 2
setpos -50 6 44 0 -18
wait 1
noclip
wait 90
screenshot shots/dveg/weather_yard.png
wait 2
setpos 113 3 52 0 -12
wait 1
noclip
wait 60
screenshot shots/dveg/aim_stand.png
wait 2
setpos 90 70 120 40 -28
wait 1
noclip
wait 200
screenshot shots/dveg/overview.png
wait 2
setpos 0 420 330 0 -52
wait 1
noclip
wait 240
screenshot shots/dveg/overview_high.png
wait 2
ow_stats
// back on foot: drive a car west of the room (vehicle_test drive: full throttle north, steer, brake)
setpos -100 0.05 40 0 0
wait 20
vehicle_test drive
wait 300
screenshot shots/dveg/vehicle_drive.png
wait 2
wait 600
quit
