// Fire animation (docs/FIRE_ANIM.md): hip and ADS captures of the rifle around a single shot (the
// shot tick, +2, +6, +12 ticks) and during a mag dump; sway_check; fire_bench. Run with
// dev_fixed_fps 60 so every frame is one tick: deadground --test --nosound --log <log> --script tools/tests/fire_anim.cfg
set dev_fixed_fps 60
set r_maxfps 60
wait 90
time_pause 1
time_set 13:00 instant
set r_motion_blur 1
infinite_ammo
give rifle
wait 5
slot 1
setpos -22 0.05 -6 0 0
wait 40
attach optic none
lookat -22 1.3 -12.5
wait 40
screenshot shots/fire_anim/rifle_hip_0_rest.png
wait 2
+attack
wait 1
screenshot shots/fire_anim/rifle_hip_1_shot_tick.png
-attack
wait 1
screenshot shots/fire_anim/rifle_hip_2_plus2.png
wait 3
screenshot shots/fire_anim/rifle_hip_3_plus6.png
wait 5
screenshot shots/fire_anim/rifle_hip_4_plus12.png
wait 60
+aim
wait 40
screenshot shots/fire_anim/rifle_ads_0_rest.png
wait 2
+attack
wait 1
screenshot shots/fire_anim/rifle_ads_1_shot_tick.png
-attack
wait 3
screenshot shots/fire_anim/rifle_ads_2_plus4.png
wait 60
-aim
wait 40
sway_check
fire_bench
wait 5
quit
