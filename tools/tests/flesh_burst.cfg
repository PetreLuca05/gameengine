// Real-time burst look from the side (2.5 m), two frames after each hit, then the aftermath.
wait 60
time_pause 1
time_set 13:00 instant
setpos -7.6 0.05 -40.2 0 0
wait 5
lookat -10 1.3 -39.6
wait 5
flesh_shoot 5 zombie chest rifle
wait 2
screenshot C:/C/Game/build/shots/burst_rifle.png
wait 60
flesh_shoot 5 zombie head sniper
wait 2
screenshot C:/C/Game/build/shots/burst_head.png
wait 60
flesh_shoot 5 zombie stomach shotgun
wait 2
screenshot C:/C/Game/build/shots/burst_shotgun.png
wait 60
flesh_shoot 5 zombie chest bat
wait 3
screenshot C:/C/Game/build/shots/burst_melee.png
wait 60
flesh_shoot 5 zombie chest rifle kill
wait 3
screenshot C:/C/Game/build/shots/burst_kill.png
wait 600
lookat -10 0.0 -40
wait 3
screenshot C:/C/Game/build/shots/burst_pool.png
wait 3
quit
