// Player FOV (docs/CAMERA_HOLDPOINT.md "Field of view"): the Settings rows (Graphics -> Comfort: Field
// of View = cl_fov, ADS Field of View = cl_ads_fov, Weapon Field of View = cl_weapon_fov), then the
// same view at Field of View 80 and 120 (horizontal at 16:9), aimed in both ADS modes, the three
// Weapon FOVs, and a host override (sv_fov 100 wins over cl_fov). Screenshots into shots/fov/ (run from
// build/bin).
set dev_fixed_fps 60
set r_maxfps 60
wait 60
time_pause 1
time_set 13:00 instant
give rifle
wait 5
wield rifle
setpos 0 0.05 22 0 0
wait 5
setang 0 0
ui_screen settings:0
wait 10
screenshot shots/fov/settings_view.png
wait 2
ui_screen close
wait 5
set cl_fov 80
wait 60
fov_report
screenshot shots/fov/fov80.png
wait 2
set cl_fov 120
wait 60
fov_report
screenshot shots/fov/fov120.png
wait 2
+aim
wait 40
fov_report
screenshot shots/fov/fov120_ads_independent.png
wait 2
set cl_ads_fov 1
wait 10
fov_report
screenshot shots/fov/fov120_ads_affected.png
wait 2
-aim
set cl_ads_fov 0
wait 40
set cl_weapon_fov 0
wait 30
fov_report
screenshot shots/fov/weapon_narrow.png
wait 2
set cl_weapon_fov 2
wait 30
fov_report
screenshot shots/fov/weapon_wide.png
wait 2
set cl_weapon_fov 1
set sv_fov 100
wait 60
fov_report
set sv_fov 0
set cl_fov 80
wait 60
fov_report
quit
