// Player FOV (docs/ATTACHMENTS.md "FOV and sensitivity"): the Settings slider (Graphics -> View:
// Field of view = cl_fov, Aim zoom = cl_ads_world_zoom), then the same view at cl_fov 60 and 110,
// and a host override (sv_fov 75 wins over cl_fov). Screenshots into shots/fov/ (run from build/bin).
set dev_fixed_fps 60
set r_maxfps 60
wait 60
time_pause 1
time_set 13:00 instant
give rifle
wait 5
slot 1
setpos 0 0.05 22 0 0
wait 5
setang 0 0
ui_screen settings:0
wait 10
screenshot shots/fov/settings_view.png
wait 2
ui_screen close
wait 5
set cl_fov 60
wait 60
fov_report
screenshot shots/fov/fov60.png
wait 2
set cl_fov 110
wait 60
fov_report
screenshot shots/fov/fov110.png
wait 2
set sv_fov 75
wait 60
fov_report
set sv_fov 0
set cl_fov 75
wait 60
fov_report
quit
