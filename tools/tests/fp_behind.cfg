// Reproduce: first-person camera vs. the body (looking ahead / down, walking, sprinting, crouch).
set cam_debug 2
give rifle
wield rifle
wait 40
setpos 0 0.05 20 0 0
wait 40
screenshot C:/C/Game/build-alt/fpb_ahead.png
wait 3
setang 0 -60
wait 20
screenshot C:/C/Game/build-alt/fpb_down60.png
wait 3
setang 0 -85
wait 20
screenshot C:/C/Game/build-alt/fpb_down85.png
wait 3
setang 0 -30
+forward
wait 40
screenshot C:/C/Game/build-alt/fpb_walk.png
wait 3
+sprint
wait 40
screenshot C:/C/Game/build-alt/fpb_sprint.png
wait 3
-sprint
-forward
+crouch
wait 40
setang 0 -70
wait 20
screenshot C:/C/Game/build-alt/fpb_crouch_down.png
wait 3
-crouch
set cam_third 1
setang 180 -10
wait 30
screenshot C:/C/Game/build-alt/fpb_third.png
wait 3
quit
