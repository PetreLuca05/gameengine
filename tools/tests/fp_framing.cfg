// First-person framing against the MWII reference (docs/CAMERA_HOLDPOINT.md "Framing"): the rifle at
// Field of View 80 / Weapon Field of View Default / hip against assets/player/fp_framing.json; the same
// arms placement at Field of View 100 and 120 and looking 60 deg down / up; the sight's place across
// Narrow / Wide; the hip <-> ADS path (no overshoot); every other gun's hand and sight height.
// Run from build/bin, then check:
//   ./deadground --test --nosound --log fpf.log --script ../../tools/tests/fp_framing.cfg
//   python ../../tools/tests/fp_framing_check.py fpf.log
set r_maxfps 60
set wpn_sway_scale 0
set wpn_bob_scale 0
wait 30
setpos 0 0.05 22 0 0
inv_clear
give rifle
wield rifle
wait 90
fp_framing rifle80
set cl_fov 100
wait 30
fp_framing rifle100
set cl_fov 120
wait 30
fp_framing rifle120
set cl_fov 80
setpos 0 0.05 22 0 -60
wait 40
fp_framing pitch_down
setpos 0 0.05 22 0 60
wait 40
fp_framing pitch_up
setpos 0 0.05 22 0 0
wait 40
set cl_weapon_fov 0
wait 30
fp_framing narrow
set cl_weapon_fov 2
wait 30
fp_framing wide
set cl_weapon_fov 1
wait 30
fp_framing_track 100
+aim
wait 50
-aim
wait 55
inv_clear
give pistol
wield pistol
wait 90
fp_framing pistol
inv_clear
give smg
wield smg
wait 90
fp_framing smg
inv_clear
give lmg
wield lmg
wait 90
fp_framing lmg
inv_clear
give shotgun
wield shotgun
wait 90
fp_framing shotgun
inv_clear
give dmr
wield dmr
wait 90
fp_framing dmr
inv_clear
give sniper
wield sniper
wait 90
fp_framing sniper
inv_clear
give crossbow
wield crossbow
wait 90
fp_framing crossbow
quit
