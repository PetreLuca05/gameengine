// First-person rules (docs/CAMERA_HOLDPOINT.md): the body stays the pose everyone computes while the
// arms layer is tuned (fp_rules_report PASS: the frame re-solve equals the tick pose bit for bit, no
// edit after spine look / IK, the mesh masks consistent), the camera stays near the head eye
// (cam_anchor_report), the layer toggles (body only / arms only: nothing drawn twice), the equip raise
// and ADS. Screenshots fpr_*.png in the working directory (build/bin).
set r_maxfps 60
wait 30
setpos 2 0 12 0 0
give rifle
give pistol
slot 1
wait 60
cam_anchor_report reset
screenshot fpr_hip.png
wait 2
// The arms layer tuned: the arms + rifle move on screen, the body doesn't.
arms_layer_set hip offset 0.04 0.03 -0.05
arms_layer_set hip rotation 0 0 8
wait 20
screenshot fpr_hip_tuned.png
wait 2
arms_layer_reload
// Body only / arms only.
cl_fp_layers 1
setang 0 -60
wait 10
screenshot fpr_body_only.png
wait 2
cl_fp_layers 2
wait 4
screenshot fpr_arms_only.png
wait 2
cl_fp_layers 3
wait 4
screenshot fpr_both.png
wait 2
setang 0 0
// ADS (presented by the arms layer; the model stays unchanged).
+aim
wait 40
screenshot fpr_ads.png
wait 2
-aim
wait 30
// The equip raise (0.3 s): mid-way and done.
slot 2
wait 7
screenshot fpr_equip_mid.png
wait 2
wait 30
screenshot fpr_equip_done.png
wait 2
slot 1
wait 40
// Locomotion for the anchor: walk, run, sprint, crouch.
+forward
wait 90
+sprint
wait 90
-sprint
-forward
+crouch
wait 40
+forward
wait 60
-forward
-crouch
wait 40
fp_rules_report
cam_anchor_report
wait 5
quit
