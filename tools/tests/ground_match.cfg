// Ground match captures (tools/ground_match.py cfg writes this file; docs/GROUND_REFERENCE.md):
// each reference view's map / pose / FOV / time / weather, one screenshot each. Run from any directory:
//   deadground --test --nosound --log <log> --script tools/tests/ground_match.cfg ; py tools/ground_match.py report <dir>
set r_maxfps 60
set cl_camera_socket 0
set cl_fp_body 0
map vegetation
wait 20
set cl_fov 52.1
time_set 16:30
time_pause
weather_set clear 0
weather_lock 1
setpos 4 15.4 58 20 -18
wait 40
screenshot ground_match_r1.png
wait 2
set cl_fov 50.5
time_set 13:00
time_pause
weather_set overcast 0
weather_lock 1
setpos 8 15.2 128 180 -10
wait 40
screenshot ground_match_r2.png
wait 2
set cl_fov 50.5
time_set 12:00
time_pause
weather_set overcast 0
weather_lock 1
setpos -20 14.6 40 0 -12
wait 40
screenshot ground_match_r3.png
wait 2
set cl_fov 50.5
time_set 12:00
time_pause
weather_set overcast 0
weather_lock 1
setpos 30 15.8 20 60 -25
wait 40
screenshot ground_match_r4.png
wait 2
set cl_fov 46.7
time_set 11:00
time_pause
weather_set clear 0
weather_lock 1
setpos -10 16 70 340 -15
wait 40
screenshot ground_match_r5.png
wait 2
quit
