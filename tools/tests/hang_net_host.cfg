// Ledge hang seen by a client (host side): rifle slung, then the pistol aimed and fired, climb up.
set r_maxfps 60
set cl_name HangHost
wait 60
give rifle
give pistol
infinite_ammo 1
slot 1
wait 1500
setpos 6 0 -15.9 0 15
wait 10
+forward
wait 12
+jump
wait 16
-forward
-jump
wait 30
getpos
setang 0 10
wait 250
setang 70 -10
wait 250
slot 2
wait 250
setang 70 -10
wait 250
setang -60 -25
wait 120
+attack
wait 2
-attack
wait 130
setang 100 -30
wait 250
+jump
wait 3
-jump
wait 250
getpos
wait 100
quit
