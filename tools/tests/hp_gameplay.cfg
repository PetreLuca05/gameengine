// Universal grips in play (docs/HANDPOSE.md): the rifle and the pistol at hip / ADS / sprint in
// first and third person, a medkit, the car and the motorcycle driver hands (+ the vehicle glue
// test). The grips are the same in every state; only the hold point moves. Run from build/bin:
//   ./deadground.exe --test --nosound --log t_hp_gameplay.log --script ../../tools/tests/hp_gameplay.cfg
set r_maxfps 60
set r_motion_blur 0
time_pause 1
time_set 12:00 instant
wait 30
give rifle
slot 1
wait 60
screenshot t_hpg_rifle_hip.png
wait 2
set holdpoint_force_state 1
wait 40
screenshot t_hpg_rifle_ads.png
wait 2
set holdpoint_force_state 2
wait 40
screenshot t_hpg_rifle_sprint.png
wait 2
set cl_thirdperson 1
set holdpoint_force_state 0
wait 40
screenshot t_hpg_rifle_hip_tp.png
wait 2
set holdpoint_force_state 1
wait 40
screenshot t_hpg_rifle_ads_tp.png
wait 2
set holdpoint_force_state 2
wait 40
screenshot t_hpg_rifle_sprint_tp.png
wait 2
set holdpoint_force_state -1
set cl_thirdperson 0
give pistol
slot 2
wait 60
screenshot t_hpg_pistol_hip.png
wait 2
set holdpoint_force_state 1
wait 40
screenshot t_hpg_pistol_ads.png
wait 2
set holdpoint_force_state -1
give medkit
slot 3
wait 60
screenshot t_hpg_medkit.png
wait 2
slot 1
// Vehicles: the car (seated, both hands on the wheel), the motorcycle, the glue test.
setpos -100 0.05 40 0 0
wait 20
spawn_vehicle car 3
wait 30
vehicle_enter
wait 60
screenshot t_hpg_car_fp.png
wait 2
set cl_thirdperson 1
wait 30
screenshot t_hpg_car_tp.png
wait 2
set cl_thirdperson 0
vehicle_exit
wait 30
setpos -100 0.05 30 0 0
wait 20
spawn_vehicle moto 1.5
wait 30
vehicle_enter
wait 60
screenshot t_hpg_moto_fp.png
wait 2
set cl_thirdperson 1
wait 30
screenshot t_hpg_moto_tp.png
wait 2
set cl_thirdperson 0
vehicle_exit
wait 30
setpos -100 0.05 40 0 0
wait 20
vehicle_test glue
wait 320
vehicle_test glue_moto
wait 320
quit
