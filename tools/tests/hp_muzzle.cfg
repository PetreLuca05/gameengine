// Hand pose editor: the rifle's muzzle socket (docs/HANDPOSE.md "Muzzle") - the marker and the
// barrel line on the item; selected and moved with a typed grab (G -Z 3 cm), typed exactly (hpe
// muzzle x y z), snapped to the barrel tip / the bore; undo / redo; a suppressor mounted (the shots
// leave its front); saved into handpose_editor_dir (not the data files). After each edit + a few
// ticks, `hpe muzzle` prints the game's side (the held socket, the shot origin, the aim claim) next
// to the marker. Screenshots t_hp_muzzle_*.png. Run from build/bin:
//   ./deadground.exe --test --nosound --log t_hp_muzzle.log --script ../../tools/tests/hp_muzzle.cfg
//   python ../../tools/tests/hp_muzzle_check.py t_hp_muzzle.log t_hp_muzzle
set r_maxfps 60
wait 30
set handpose_editor_dir t_hp_muzzle
scene handpose
hpe select rifle
hpe muzzle select
hpe view ctrl
hpe view -95 -6 1.1
wait 120
screenshot t_hp_muzzle_start.png
wait 2
echo hp_muzzle_step start
hpe muzzle
aim_report
// G, -Z typed 0.03: 3 cm forward along the barrel (the item's axes).
echo hp_muzzle_step moved
hpe xform move z -0.03
hpe muzzle
wait 10
echo hp_muzzle_step moved_tick
hpe muzzle
aim_report
hpe view ctrl
hpe view -95 -6 0.45
wait 10
screenshot t_hp_muzzle_moved.png
wait 2
// Typed, then the helpers: the barrel's front face, its centre line.
echo hp_muzzle_step typed
hpe muzzle 0.01 0.07 -0.6
echo hp_muzzle_step tip
hpe muzzle tip
echo hp_muzzle_step typed2
hpe muzzle 0.004 0.062 -0.5305
echo hp_muzzle_step bore
hpe muzzle bore
wait 10
echo hp_muzzle_step bore_tick
hpe muzzle
screenshot t_hp_muzzle_bore.png
wait 2
// Undo: the bore snap, the typed value; redo the typed value.
echo hp_muzzle_step undo1
hpe undo
hpe muzzle
echo hp_muzzle_step undo2
hpe undo
hpe muzzle
echo hp_muzzle_step redo
hpe redo
hpe muzzle
// A suppressor on the muzzle slot: the shots leave its front face (cyan), the socket stays.
attach muzzle suppressor
wait 10
echo hp_muzzle_step device
hpe muzzle
hpe view ctrl
hpe view -95 -6 0.8
wait 10
screenshot t_hp_muzzle_device.png
wait 2
attach muzzle none
wait 10
echo hp_muzzle_step device_off
hpe muzzle
// Saved into t_hp_muzzle/data/weapons/02_rifle.json (handpose_editor_dir), not the source tree.
echo hp_muzzle_step save
hpe muzzle save
echo hp_muzzle_step end
hpe dump
scene off
wait 10
quit
