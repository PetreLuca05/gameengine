// Hand pose editor: the rifle's muzzle socket (docs/HANDPOSE.md "Muzzle") - the marker and the
// barrel line on the item; selected and moved with a typed grab (G -Z 3 cm), typed exactly (hpe
// muzzle x y z), snapped to the barrel tip / the bore; undo / redo; a suppressor mounted (the shots
// leave its front); saved into handpose_editor_dir (not the data files). aim_report shows the game
// shooting from the moved socket. Screenshots t_hp_muzzle_*.png. Run from build/bin:
//   ./deadground.exe --test --nosound --log t_hp_muzzle.log --script ../../tools/tests/hp_muzzle.cfg
//   python ../../tools/tests/hp_muzzle_check.py t_hp_muzzle.log t_hp_muzzle
set r_maxfps 60
wait 30
set handpose_editor_dir t_hp_muzzle
scene handpose
hpe select rifle
hpe muzzle select
hpe view root
hpe view -95 -6 0.75
wait 120
screenshot t_hp_muzzle_start.png
wait 2
hpe muzzle
aim_report
// G, -Z typed 0.03: 3 cm forward along the barrel (the item's axes).
hpe xform move z -0.03
wait 10
aim_report
hpe view ctrl
hpe view -95 -6 0.45
wait 10
screenshot t_hp_muzzle_moved.png
wait 2
// Typed, then the helpers: the barrel's front face, its centre line.
hpe muzzle 0.01 0.07 -0.6
hpe muzzle tip
hpe muzzle 0.004 0.062 -0.5305
hpe muzzle bore
wait 10
screenshot t_hp_muzzle_bore.png
wait 2
// Undo: the bore snap, the typed value; redo the typed value.
hpe undo
hpe muzzle
hpe undo
hpe muzzle
hpe redo
hpe muzzle
// A suppressor on the muzzle slot: the shots leave its front face (cyan), the socket stays.
attach muzzle suppressor
wait 10
hpe muzzle
hpe view root
hpe view -95 -6 0.9
wait 10
screenshot t_hp_muzzle_device.png
wait 2
attach muzzle none
wait 5
// Saved into t_hp_muzzle/data/weapons/02_rifle.json (handpose_editor_dir), not the source tree.
hpe muzzle save
hpe dump
scene off
wait 10
quit
