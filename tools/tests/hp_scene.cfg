// Hand pose editor (docs/HANDPOSE.md "Editor"): the rifle's universal grip on the control rig -
// move / rotate the right IK control, rotate a finger joint, the root (both hands follow), undo /
// redo, save into handpose_editor_dir (not the source tree); the world frozen for 600 ticks; the
// door knob case paused at its contact frame with keys (onion skin), the car driver case with the
// steering wheel moved through its anchor, the ledge, the phone in portrait. Screenshots of each
// (t_hp_scene_*.png). Run from build/bin:
//   ./deadground.exe --test --nosound --log t_hp_scene.log --script ../../tools/tests/hp_scene.cfg
set r_maxfps 60
wait 30
set handpose_editor_dir t_hp_scene
scene
scene handpose
hpe select rifle
hpe view -40 -12 0.9
hpe tool move
hpe ctrl IK_hand_R
wait 120
screenshot t_hp_scene_rig.png
wait 2
hpe dump
// G Z 0.02 (typed), R X 20, a finger joint (rotate gizmo), the root.
hpe xform move z 0.02
hpe xform rotate x 20
hpe ctrl R_index_1
hpe tool rotate
hpe xform rotate x 30
hpe ctrl Root
hpe tool move
hpe xform move y 0.03
wait 30
screenshot t_hp_scene_edit.png
wait 2
hpe ctrl R_index_1
hpe tool rotate
hpe view -20 -5 0.45
wait 20
screenshot t_hp_scene_finger.png
wait 2
hpe undo
hpe undo
hpe redo
hpe dump
hpe save
// Frozen world: time, weather, zombies, vehicles unchanged after 600 ticks.
hpe freeze begin
wait 600
hpe freeze check
// Door knob: the timeline paused at the contact frame, keys at contact and release, onion skin.
hpe case door_knob
wait 20
hpe time 0.16
hpe keyframe
hpe ctrl IK_hand_R
hpe tool move
hpe xform move x 0.01
hpe time 0.54
hpe keyframe
hpe xform move y 0.08
hpe time 0.3
hpe view -60 -10 1.2
wait 40
screenshot t_hp_scene_door_onion.png
wait 2
hpe time 0.16
wait 20
screenshot t_hp_scene_door.png
wait 2
hpe dump
hpe time 0.05
wait 20
screenshot t_hp_scene_door_reach.png
wait 2
hpe time 0.16
// The car: seated, the steering wheel (the case root) moved and turned: the hands follow.
hpe case vehicle_car_driver
wait 30
hpe ctrl Root
hpe view 140 -20 1.3
wait 30
screenshot t_hp_scene_car.png
wait 2
hpe xform move y 0.05
hpe xform rotate x 15
wait 40
screenshot t_hp_scene_car_wheel.png
wait 2
hpe dump
hpe save
// The ledge grab (hanging): the anchors on the edge.
hpe case mantle_ledge
wait 40
hpe view -30 -15 1.6
wait 30
screenshot t_hp_scene_ledge.png
wait 2
// The phone in portrait: the phone's universal grip in the phone hold state.
hpe case phone_portrait
wait 40
hpe view -50 -10 0.7
wait 30
screenshot t_hp_scene_phone.png
wait 2
hpe dump
scene off
wait 10
quit
