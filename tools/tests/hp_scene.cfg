// Hand pose editor scene (docs/HANDPOSE.md "Editor"): open it, select the rifle, close the right
// index finger, undo / redo, save into handpose_editor_dir (not the source tree); the vertical grip
// (left hand, contact solver closing every finger), a medkit (preset + a contact point), the first-
// person view. Screenshots of each. Run from build/bin:
//   ./deadground.exe --test --nosound --log t_hp_scene.log --script ../../tools/tests/hp_scene.cfg
set r_maxfps 60
wait 30
set handpose_editor_dir t_hp_scene
scene
scene handpose
hpe select rifle
hpe hand r
hpe state hip
hpe view 150 -10 0.55
wait 60
screenshot t_hp_scene_before.png
wait 2
hpe joint index 0 80
hpe joint index 1 105
hpe joint index 2 85
hpe dump
wait 30
screenshot t_hp_scene_after.png
wait 2
hpe undo
hpe dump
hpe redo
hpe save
hpe dump
hpe view item
hpe view 200 -20 0.9
wait 30
screenshot t_hp_scene_item.png
wait 2
// Attachment grip: the left hand on the vertical grip, every finger closed onto the item boxes.
hpe select att_vertical_grip
hpe hand l
hpe state hip
hpe view hand
hpe view 215 -5 0.45
wait 60
hpe solve all
hpe dump
wait 30
screenshot t_hp_scene_grip.png
wait 2
// An item: fist preset, then the index on a contact point at its fingertip, solved.
hpe select medkit
hpe hand r
hpe preset relaxed
wait 30
hpe contact index
hpe solve
hpe dump
wait 30
screenshot t_hp_scene_medkit.png
wait 2
hpe select rifle
hpe view fp
wait 40
screenshot t_hp_scene_fp.png
wait 2
scene off
wait 10
quit
