// Hold point: rifle hip / ADS / sprint, pistol hip / ADS, empty hands (first person).
wait 30
set cam_debug 1
give rifle
slot 1
wait 60
screenshot C:/C/Game/build/t_hp_rifle_hip.png
wait 2
set holdpoint_force_state 1
wait 40
screenshot C:/C/Game/build/t_hp_rifle_ads.png
wait 2
set holdpoint_force_state 2
wait 40
screenshot C:/C/Game/build/t_hp_rifle_sprint.png
wait 2
set holdpoint_force_state -1
give pistol
slot 2
wait 60
screenshot C:/C/Game/build/t_hp_pistol_hip.png
wait 2
set holdpoint_force_state 1
wait 40
screenshot C:/C/Game/build/t_hp_pistol_ads.png
wait 2
set holdpoint_force_state 5
wait 40
screenshot C:/C/Game/build/t_hp_empty.png
wait 2
quit
