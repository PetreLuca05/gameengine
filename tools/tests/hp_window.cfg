// Hand pose editor in its own window (docs/HANDPOSE.md "Own window"): the panels and the orbit view
// in a second OS window, the game window keeps its first-person view + HUD and shows the edits at
// once. Screenshots of both windows before / after moving the right IK control and the root, a case
// (door knob), then leaving (the window closes). t_hp_window_*.png. Run from build/bin (add
// --validation with VK_ADD_LAYER_PATH set to check the second swapchain):
//   ./deadground.exe --test --nosound --log t_hp_window.log --script ../../tools/tests/hp_window.cfg
set r_maxfps 60
wait 30
set handpose_editor_dir t_hp_window
set handpose_editor_window 1
scene handpose
hpe select rifle
hpe view -40 -12 0.9
hpe tool move
hpe ctrl IK_hand_R
wait 120
screenshot t_hp_window_game.png
hpe window t_hp_window_editor.png
wait 3
hpe dump
// The right hand 4 cm forward and the root 3 cm up: both windows follow.
hpe xform move z -0.04
hpe ctrl Root
hpe xform move y 0.03
wait 30
screenshot t_hp_window_game_edit.png
hpe window t_hp_window_editor_edit.png
wait 3
hpe ctrl R_index_1
hpe tool rotate
hpe view -20 -5 0.45
wait 20
hpe window t_hp_window_editor_finger.png
wait 3
hpe undo
hpe undo
hpe case door_knob
wait 60
screenshot t_hp_window_game_case.png
hpe window t_hp_window_editor_case.png
wait 3
scene off
wait 30
screenshot t_hp_window_after.png
wait 3
quit
