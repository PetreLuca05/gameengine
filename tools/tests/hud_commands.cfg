// Pause > Commands (docs/UI_WHEELS_HUD.md "Commands tab") and Settings > HUD.
// Run: deadground --test --nosound --log cmds.log --script tools/tests/hud_commands.cfg
set r_maxfps 60
wait 40
ui_screen commands
wait 10
commands_filter all
screenshot cmds_all.png
wait 2
commands_filter rendering bloom
wait 6
screenshot cmds_search.png
wait 2
commands_filter favorites
wait 6
screenshot cmds_favorites.png
wait 2
// Run a destructive command from the list: the confirm dialog
commands_filter system quit
wait 4
ui_mouse 0.5 0.5
wait 2
ui_screen close
wait 4
ui_screen settings:7
wait 10
screenshot cmds_settings_hud.png
wait 2
ui_screen close
ui_screen copypos
wait 4
quit
