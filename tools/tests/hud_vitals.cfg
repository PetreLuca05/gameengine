// HUD (docs/INVENTORY.md "HUD"): the weapon list bottom left, health and armor (plate segments) centred
// at the bottom, at 16:9, 21:9 and 4:3. tools/tests/hud_vitals_check.py <dir> finds the armor plates
// (theme colour info) and the health bar in each screenshot and checks the block is centred.
//   cd build/bin && ./deadground --test --nosound --script ../../tools/tests/hud_vitals.cfg
set r_maxfps 60
wait 60
time_pause 1
time_set 13:00 instant
inv_clear
give rifle
give pistol
give plate_carrier
give armor 4
setpos 0 0.05 22 0 0
setang 0 30
// Four plates (the carrier holds 4): every segment full.
wield armor
wait 10
+attack
wait 175
-attack
wait 10
wield armor
wait 10
+attack
wait 175
-attack
wait 10
wield armor
wait 10
+attack
wait 175
-attack
wait 10
wield armor
wait 10
+attack
wait 175
-attack
wait 10
wield rifle
wait 30
set r_mode 0
set r_width 1920
set r_height 1080
vid_restart
wait 40
screenshot hud_vitals_16x9.png
wait 3
set r_width 2560
set r_height 1080
vid_restart
wait 40
screenshot hud_vitals_21x9.png
wait 3
set r_width 1024
set r_height 768
vid_restart
wait 40
screenshot hud_vitals_4x3.png
wait 3
quit
