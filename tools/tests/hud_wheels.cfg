// Radial wheels, timed ring, kill counter / feed, compass, pings, door peek (docs/UI_WHEELS_HUD.md).
// Run: deadground --test --nosound --log hud.log --script tools/tests/hud_wheels.cfg
// Screenshots: hud_*.png in the working directory.
set r_maxfps 60
set sv_cheats 1
wait 60
give medkit 2
give bandage 3
give painkillers 1
give frag_grenade 2
give flare 2
damage 40
wait 10
// Healing wheel (C held): slot 1 = bandage (the order in healing.json is medkit, bandage, ...)
wheel_open heal 1
wait 12
screenshot hud_heal_wheel.png
wait 2
wheel_release
wait 20
screenshot hud_heal_ring.png
wait 90
// Throwables wheel
wheel_open throw 0
wait 12
screenshot hud_throw_wheel.png
wait 2
wheel_release
wait 30
// Ping wheel + pings on the compass / world
setpos 2 0 2 0 -5
wait 10
wheel_open ping 1
wait 12
screenshot hud_ping_wheel.png
wait 2
wheel_release
wait 10
setang 60 -5
wait 5
ping loot
wait 20
setang -30 -5
wait 5
ping go
wait 30
setang 0 -5
wait 10
screenshot hud_pings.png
wait 2
ping_list
// Kills: zombies in front, killed (kill counter + feed)
zombie_spawn 6
wait 30
zombie_kill_nearest 2
wait 4
zombie_kill_nearest 1 head
wait 12
screenshot hud_kills.png
wait 2
// Throw a cooked grenade at the rest (slot 4), then a flare (slot 5)
slot 4
wait 20
+attack
wait 6
-attack
wait 3
screenshot hud_throw.png
wait 60
screenshot hud_explosion.png
wait 2
slot 5
wait 20
+attack
wait 4
-attack
wait 40
time_set 22:30
wait 30
screenshot hud_flare.png
wait 2
time_set 16:00
kill_stats
// Door wheel + peek through the visor (door_a at 12 0 9)
setpos 10.6 0 9
wait 5
lookat 12 1.3 9
wait 20
wheel_open door
wait 12
screenshot hud_door_wheel.png
wait 2
wheel_select 2
wait 2
wheel_release
wait 30
screenshot hud_peek.png
wait 2
peek
wait 10
wheel_open door
wait 4
wheel_select 1
wheel_release
wait 60
screenshot hud_door_slam.png
wait 2
// Other aspect ratios (21:9, 4:3) with a wheel open
setpos 2 0 2 0 -5
wait 5
set r_mode 0
set r_width 2560
set r_height 1080
vid_restart
wait 20
wheel_open ping 4
wait 12
screenshot hud_219.png
wait 2
wheel_cancel
set r_width 1024
set r_height 768
vid_restart
wait 20
wheel_open heal 0
wait 12
screenshot hud_43.png
wait 2
wheel_cancel
quit
