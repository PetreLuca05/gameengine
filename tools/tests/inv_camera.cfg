// The inventory never moves the camera (docs/INVENTORY.md "Screen"): Tab opens it, the rendered camera
// over 60 frames with it open against 60 frames before it opened (position, rotation, FOV), Tab closes
// it again. tools/tests/inv_camera_check.py <log> checks it.
//   cd build/bin && ./deadground --test --nosound --log cam.log --script ../../tools/tests/inv_camera.cfg
set r_maxfps 60
wait 60
time_pause 1
time_set 13:00 instant
inv_clear
give rifle
setpos 0 0.05 22 0 0
setang 0 0
wait 90
cam_track 60 closed
wait 70
ui_key Tab
wait 3
cam_track 60 open
wait 70
ui_key Tab
wait 3
cam_track 30 closed_again
wait 40
quit
