// Drops (docs/INVENTORY.md, docs/UI_WHEELS_HUD.md "Throwables"): a G tap drops the held item (the rifle,
// hotbar 1) in front of the player; picked up again it is back on the hotbar. Then the worn hiking pack,
// discarded with things in it, lands as ONE pickup that keeps them, and comes back with the same layout.
// tools/tests/inv_drop_check.py <log> checks the dumps.
//   cd build/bin && ./deadground --test --nosound --log drop.log --script ../../tools/tests/inv_drop.cfg
set r_maxfps 60
wait 60
time_pause 1
time_set 13:00
inv_clear
give rifle
give backpack_hiking
give medkit 2
give ammo_rifle 60
give scrap 7
slot 1
setpos 0 0.05 22 0 0
setang 0 -65
wait 40
// [1] before the drop
inv_dump
+drop
wait 3
-drop
wait 40
// [2] after the G tap: no rifle
inv_dump
+use
wait 3
-use
wait 30
// [3] picked up: the rifle again, on the hotbar
inv_dump
inv_intent discard self 2
wait 40
// [4] the pack discarded: nothing of it left
inv_dump
+use
wait 3
-use
wait 30
// [5] picked up whole: the pack worn again, its contents in their cells
inv_dump
quit
