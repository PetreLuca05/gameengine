// Drops (docs/INVENTORY.md, docs/UI_WHEELS_HUD.md "Throwables"): a G tap drops the held item (the rifle,
// the primary) in front of the player; picked up again it is back in the primary slot and drawn. Then
// the worn hiking pack, discarded with things in it, lands empty: its contents stay with the player in
// the default bag; picked up again it goes back on over the bag and takes them back.
// tools/tests/inv_drop_check.py <log> checks the dumps.
//   cd build/bin && ./deadground --test --nosound --log drop.log --script ../../tools/tests/inv_drop.cfg
set r_maxfps 60
wait 60
time_pause 1
time_set 13:00
inv_clear
give rifle
give backpack_hiking
give medkit 2
give ammo_rifle 60
give scrap 7
wield rifle
setpos 0 0.05 22 0 0
setang 0 -65
wait 40
// [1] before the drop
inv_dump
+drop
wait 3
-drop
wait 40
// [2] after the G tap: no rifle
inv_dump
+use
wait 3
-use
wait 30
// [3] picked up: the rifle again, in the primary slot
inv_dump
// The hiking pack's uid: inv_clear restarts the uids (1 the default bag, 2 the rifle, 3 the pack).
inv_intent discard self 3
wait 40
// [4] the pack discarded: its contents in the default bag
inv_dump
+use
wait 3
-use
wait 30
// [5] picked up: the pack worn again, its contents back in it
inv_dump
quit
