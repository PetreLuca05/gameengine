// One of the two looters (inv_net.sh): 150 ms fake lag, conflicting intents fired inside one round
// trip (both grab the same uids), predicted at once, reconciled by the host's trees. Ends with
// the converged inventory dump (inv_net_check.py compares it with the host's).
set r_maxfps 60
set net_fakelag 150
wait 720
inventory
wait 10
inv_dump loot
inv_intent quick_move loot 1
inv_intent quick_move loot 2
inv_intent quick_move loot 3
wait 3
inv_intent quick_move loot 4
inv_intent quick_move loot 5
inv_intent move loot 6 loot 0 0 0 0 0
wait 6
screenshot SHOTDIR/inv_net_CLIENT.png
inv_intent take_all loot 0
wait 4
inv_intent quick_move self 1
inv_intent quick_move self 2
wait 30
inv_intent take_all loot 0
wait 600
inv_dump
inv_dump loot
wait 400
quit
