// One of the two looters (inv_net.sh): 150 ms fake lag, conflicting intents fired inside one round
// trip (both grab the same uids), predicted at once, reconciled by the host's trees. Ends with
// the converged inventory dump (inv_net_check.py compares it with the host's). The race itself is
// timed in frames on purpose (inside one round trip); everything around it waits on states.
set r_maxfps 60
set net_fakelag 150
// The host's inv_open opens the screen with the crate (EV_CONTAINER) once both clients are in:
// "inventory" here would toggle it shut (and close the crate on the host) before the race.
inv_wait loot 14400
inv_dump loot
inv_intent quick_move loot 1
inv_intent quick_move loot 2
inv_intent quick_move loot 3
wait 3
inv_intent quick_move loot 4
inv_intent quick_move loot 5
inv_intent move loot 6 loot 0 0 0 0 0
wait 6
screenshot SHOTDIR/inv_net_CLIENT.png
inv_intent take_all loot 0
wait 4
inv_intent quick_move self 1
inv_intent quick_move self 2
wait 30
inv_intent take_all loot 0
// Every intent acknowledged: this inventory is the host's.
inv_wait synced 3600
inv_dump
inv_dump loot
// Closing the screen closes the crate on the host (RPC_CONTAINER_CLOSE): its signal that this
// client is done. Stay connected until the host has dumped every tree and quit.
ui_screen close
inv_wait offline 7200
quit
