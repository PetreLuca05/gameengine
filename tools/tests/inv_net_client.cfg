// Inventory intents over the network (client, 200 ms fake lag): every operation shows at once
// (prediction) and the host's inventory confirms it ("inv:" lines, pending 0 after the round trip).
// Launch: deadground --test +connect 127.0.0.1 --script tools/tests/inv_net_client.cfg
set cl_name InvClient
wait 120
set net_fakelag 200
wait 200
inventory
wait 20
ui_inv_dump
// mount the red dot on the rifle (rifle 0, pistol 1, medkit 2, red dot 9, suppressor 10, scrap 11)
ui_inv_drag 9 0
wait 7
ui_inv_dump
wait 40
ui_inv_dump
// three intents back to back, inside one round trip: suppressor -> pistol, split scrap, quick move medkit
ui_inv_drag 10 1
wait 7
ui_inv_drag 11 20 ctrl
wait 7
ui_inv_shiftclick 2
wait 2
ui_inv_dump
screenshot inv_net_client.png
wait 45
ui_inv_dump
// unmount the red dot into slot 25, then swap the scrap stack with the rifle
ui_inv_select 0
wait 4
ui_inv_drag_att 0 25
wait 7
ui_inv_drag 20 0
wait 50
ui_inv_dump
quit
