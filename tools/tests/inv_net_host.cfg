// Two clients loot one crate (docs/INVENTORY.md "Networking"): the host opens the dev room's
// inv_crate for both (sv_inv_reach covers where they stand), dumps every tree before and after.
// tools/tests/inv_net.sh runs it; tools/tests/inv_net_check.py checks nothing was duplicated or lost.
// Every step waits on a state, never a frame count: both clients in, then each client's own end of
// the race (it closes its inventory once its intents are all acknowledged and it has dumped).
set r_maxfps 60
set sv_inv_reach 200
net_wait_clients 2 14400
// Spawned and synced (the welcome is in; the first snapshots and trees are a few frames behind it).
wait 120
inv_dump 1
inv_dump 2
inv_dump loot inv_crate
inv_open inv_crate 1
inv_open inv_crate 2
inv_wait closed 1 14400
inv_wait closed 2 14400
inv_dump loot inv_crate
inv_dump 1
inv_dump 2
wait 30
quit
