// Two clients loot one crate (docs/INVENTORY.md "Networking"): the host opens the dev room's
// inv_crate for both (sv_inv_reach covers where they stand), dumps every tree before and after.
// tools/tests/inv_net.sh runs it; tools/tests/inv_net_check.py checks nothing was duplicated or lost.
set r_maxfps 60
set sv_inv_reach 200
wait 600
inv_dump 1
inv_dump 2
inv_dump loot inv_crate
inv_open inv_crate 1
inv_open inv_crate 2
wait 1500
inv_dump loot inv_crate
inv_dump 1
inv_dump 2
wait 30
quit
