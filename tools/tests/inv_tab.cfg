// Tab closes the inventory whatever is open on it or under it (docs/INVENTORY.md "Screen"): an item
// selected, the right-click menu, the inspect window, opened from the pause menu, a looted crate.
// ui_key holds the key two frames like a real press: the press the inventory binding counts while the
// GUI's Tab opens the screen must not reopen it after the next Tab. tools/tests/inv_tab_check.py <log>.
//   cd build/bin && ./deadground --test --nosound --log tab.log --script ../../tools/tests/inv_tab.cfg
set r_maxfps 60
wait 60
time_pause 1
inv_clear
give rifle
give medkit 2
setpos 0 0.05 22 0 0
wait 30
// An item selected.
ui_key Tab
wait 20
cam_track 3 opened
wait 5
ui_inv_click c:self:grid:0:0:0
wait 10
ui_key Tab
wait 10
cam_track 3 after_select
wait 10
// The right-click menu open.
ui_key Tab
wait 20
ui_inv_click c:self:grid:0:0:0 right
wait 10
ui_key Tab
wait 10
cam_track 3 context_open
wait 10
// The inspect window open (double click on the primary slot).
ui_key Tab
wait 20
ui_inv_click e:primary double
wait 20
ui_key Tab
wait 10
cam_track 3 inspect_open
wait 10
// Opened from the pause menu (Esc, Inventory): Tab closes both.
ui_key Escape
wait 10
menu inventory
wait 20
ui_key Tab
wait 10
cam_track 3 from_pause
wait 10
ui_screen close
wait 10
// A looted crate.
setpos 7.2 0.05 26.2 0 0
wait 20
lookat 7.2 0.4 27.6
wait 20
+use
wait 90
-use
wait 30
cam_track 3 crate_open
wait 10
ui_key Tab
wait 15
cam_track 3 crate_after_tab
wait 10
quit
