// Building kit hot reload in the engine (docs/BUILDING_KIT.md): the chapter 1 storey, kit_reload of every
// piece rebuilds the instances' draws and collision in place (kit_info before / after must match; the log
// shows "kit: reloaded N piece(s)"). The external-edit variant (re-export a piece while the game runs, the
// mtime poll reloads it) is documented in docs/BUILDING_KIT.md "Blender workflow".
r_maxfps 60
map story_01
wait 10
kit_info
kit_reload
wait 5
kit_info
quit
