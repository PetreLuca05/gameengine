// Ledge grab / climb rules (docs/CONTROLLER.md) in the dev room ledge yard (x 50..66, z 10, walls
// 2.6 m facing +Z). Every case logs ledge_report (mode, position, regrab cooldown, the hang prompts)
// and the HUD logs "ledge: prompts shown / hidden" when the prompts appear and go.
// tools/tests/ledge_check.py checks the log:
//   deadground --test --nosound --log ledge.log --script tools/tests/ledge.cfg
//   python3 tools/tests/ledge_check.py ledge.log
set dev_fixed_fps 60
set r_maxfps 60
wait 90
time_pause 1
time_set 13:00
set pl_debug_mantle 1
set pl_regrab_cooldown 0.5
set pl_hang_stamina 0
// 1. Falling past a ledge in reach grabs it: hang + both prompts.
echo ledge_case fall_grab
setpos 52 3.2 11.2 0 0
wait 45
ledge_report
screenshot shots/ledge/fall_grab.png
wait 2
// 2. Let go (crouch): drops with its velocity, lands under the wall.
echo ledge_case let_go
+crouch
wait 1
-crouch
wait 45
ledge_report
// 3. Grab again, climb (Space): the pull-up ends on top.
echo ledge_case climb
setpos 52 3.2 11.2 0 0
wait 45
+jump
wait 2
-jump
wait 80
ledge_report
// 4. Running at the ledge: forward held, jump, jump again in reach: climbs with no hang and no prompt.
echo ledge_case run_climb
setpos 58 0.05 11.7 0 0
wait 10
+forward
wait 6
+jump
wait 2
-jump
wait 6
+jump
wait 2
-jump
// The climb started on the press: let go of forward so it does not walk off the far side.
-forward
wait 80
ledge_report
// 5. The same run without the second jump: falls back past the ledge, grabs it, prompts.
echo ledge_case run_grab
setpos 58 0.05 11.7 0 0
wait 10
+forward
wait 6
+jump
wait 2
-jump
wait 50
-forward
ledge_report
// 6. Regrab cooldown: let go (crouch tap) and nothing grabs the same ledge again while it runs...
echo ledge_case regrab_blocked
+crouch
wait 1
-crouch
wait 45
ledge_report
// ...without the cooldown the released player grabs the ledge again at once.
echo ledge_case regrab_free
set pl_regrab_cooldown 0
setpos 52 3.2 11.2 0 0
wait 45
+crouch
wait 1
-crouch
wait 20
ledge_report
set pl_regrab_cooldown 0.5
+back
wait 3
-back
wait 45
// 7. Stamina rule: with pl_hang_stamina 1 the grip gives out after a second.
echo ledge_case stamina
set pl_hang_stamina 1
setpos 52 3.2 11.2 0 0
wait 140
ledge_report
set pl_hang_stamina 0
// 8. Clearance: a slab 0.6 m over the top leaves no room: no climb, no grab.
echo ledge_case no_clearance
setpos 64 0.05 11.7 0 0
wait 10
+forward
wait 6
+jump
wait 2
-jump
wait 6
+jump
wait 2
-jump
// The climb started on the press: let go of forward so it does not walk off the far side.
-forward
wait 80
ledge_report
screenshot shots/ledge/no_clearance.png
wait 2
quit
