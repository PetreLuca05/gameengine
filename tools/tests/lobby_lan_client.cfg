// LAN lobby, client side (lobby_lan.sh).
set r_maxfps 60
set cl_name Client
wait 30
ui_nav accept
lobby_join 127.0.0.1
wait 50
lobby_status
mm_dump
screenshot lobby_client_lobby.png
wait 2
lobby_say hi host
lobby_ready 1
wait 200
status
lobby_status
mm_dump
screenshot lobby_client_game.png
wait 3
quit
