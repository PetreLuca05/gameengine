// LAN lobby, host side (lobby_lan.sh, docs/MENU_LOBBY.md "Verification"): host, the client joins,
// chat both ways, season / time change, ready, start, both load the map. lobby_wait holds the script
// until the client gets there (the two processes boot at different speeds).
set r_maxfps 60
set cl_name Host
wait 20
ui_nav accept
lobby_host lan
wait 10
lobby_season autumn 18 random
mm_tab play
lobby_wait players 2
wait 30
lobby_status
lobby_say hello from the host
wait 30
lobby_ready 1
lobby_wait ready 2
wait 20
lobby_status
lobby_start
lobby_wait state in_game
// the client loads the map after the welcome (seconds): stay until it is in
wait 900
status
lobby_status
mm_dump
screenshot lobby_host_game.png
wait 3
quit
