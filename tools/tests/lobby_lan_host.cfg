// LAN lobby, host side (lobby_lan.sh, docs/MENU_LOBBY.md "Verification"): host, the client joins,
// chat both ways, season / time change, ready, start, both load the map.
set r_maxfps 60
set cl_name Host
wait 20
ui_nav accept
lobby_host lan
wait 10
lobby_season autumn 18 random
mm_tab play
wait 60
lobby_status
lobby_say hello from the host
wait 30
lobby_ready 1
wait 60
lobby_status
lobby_start
wait 240
status
lobby_status
mm_dump
screenshot lobby_host_game.png
wait 3
quit
