// LOD fade screenshots for tools/tests/lod_check.py (docs/LOD.md "Tests"), TAA, 60 fps.
//   1. characters: the line-up (5 m pair), the LOD forced 0 -> 3 with the 0.35 s fade (fade_*.png, every 2nd
//      frame) and again with r_lod_fade_time 0 (cut_*.png): silhouette coverage change per frame;
//   2. TAA stability: the foliage yard from a fixed camera, 8 frames with the distance-band fades
//      (taa_band_*.png) and with r_lod_fade_band 0 (taa_cut_*.png): temporal variance;
//   3. no dithered instance near the camera: classic_fade_probe 40 in the foliage yard and at three spots
//      of the vegetation forest (every tree / bush / grass instance within 40 m opaque outside a cross-fade).
// From build/bin:  ./deadground.exe --test --nosound --log f.log --script ../../tools/tests/lod_fade_shots.cfg
//                  python ../../tools/tests/lod_check.py . f.log
