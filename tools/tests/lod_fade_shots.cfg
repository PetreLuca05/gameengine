// LOD fade screenshots for tools/tests/lod_check.py (docs/LOD.md "Tests"), r_vgeo 0, TAA, 60 fps.
//   1. characters: the line-up (5 m pair), the LOD forced 0 -> 3 with the 0.35 s fade (fade_*.png, every 2nd
//      frame) and again with r_lod_fade_time 0 (cut_*.png): silhouette coverage change per frame;
//   2. TAA stability: the foliage yard from a fixed camera, 8 frames with the distance-band fades
//      (taa_band_*.png) and with r_lod_fade_band 0 (taa_cut_*.png): temporal variance.
// From build/bin:  ./deadground.exe --test --nosound --log f.log +set r_vgeo 0 --script ../../tools/tests/lod_fade_shots.cfg
//                  python ../../tools/tests/lod_check.py .
set r_maxfps 60
set cl_fp_body 0
set r_vgeo 0
map flat
wait 120
setpos 0 0 0 0 0
wait 30
anim_lod_lineup
wait 60
set r_lod_force 0
wait 60
set r_lod_force 3
