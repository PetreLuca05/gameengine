// LOD ranges per Engine Fidelity tier (docs/LOD.md "Performance"): the 300k foliage yard, the
// vegetation pine forest and the 500-zombie horde (camera in noclip above it) at every level,
// uncapped. Run as is and with +set r_lod_legacy 1 (the ranges before), alternating, then compare the
// "perf_stop <label>" lines:
//   ./deadground.exe --test --nosound --log lod_perf.log --script ../../tools/tests/lod_perf.cfg
set r_maxfps 0
set r_vsync 0
set cl_fp_body 0
map devroom
wait 30
time_set 11:30
time_pause
foliage_test_scatter 300000
wait 60
setpos 220 0.1 82 180 -4
wait 200
set r_fidelity 4
wait 150
perf_stop 300 yard_modern
wait 310
set r_fidelity 3
wait 150
perf_stop 300 yard_high
wait 310
set r_fidelity 2
wait 150
perf_stop 300 yard_medium
wait 310
set r_fidelity 1
wait 150
perf_stop 300 yard_low
wait 310
set r_fidelity 0
wait 150
perf_stop 300 yard_off
wait 310
map vegetation
wait 30
time_set 11:00
time_pause
wait 200
setpos -100 17 -80 300 -5
wait 200
set r_fidelity 4
wait 150
perf_stop 300 forest_modern
wait 310
set r_fidelity 3
wait 150
perf_stop 300 forest_high
wait 310
set r_fidelity 2
wait 150
perf_stop 300 forest_medium
wait 310
set r_fidelity 1
wait 150
perf_stop 300 forest_low
wait 310
set r_fidelity 0
wait 150
perf_stop 300 forest_off
wait 310
map devroom
wait 30
time_set 11:30
time_pause
setpos 0 6 35 180 -12
wait 1
noclip
spawn_horde 500 30
wait 400
set r_fidelity 4
wait 150
perf_stop 300 horde_modern
wait 310
set r_fidelity 3
wait 150
perf_stop 300 horde_high
wait 310
set r_fidelity 2
wait 150
perf_stop 300 horde_medium
wait 310
set r_fidelity 1
wait 150
perf_stop 300 horde_low
wait 310
set r_fidelity 0
wait 150
perf_stop 300 horde_off
wait 310
set r_fidelity 4
quit
