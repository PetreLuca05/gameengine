// Scope LOD (docs/LOD.md "Scopes"): an 8x scope at the line-up characters and at the forest. Run with
// r_lod_scope 0 (before) / 1, e.g. from build/bin:
//   ./deadground.exe --test --nosound --log s.log --script ../../tools/tests/lod_scope.cfg
// char_list prints each character's LOD / pixels hip, aimed and after; classic_stats the PiP's parts;
// screenshots into the working directory: lod_scope_{hip,ads,forest,out}.png (forest: r_lod_debug 2
// colours, white LOD0 .. red LOD3, blue impostors).
set r_maxfps 60
map vegetation
wait 30
time_set 11:00 instant
time_pause
wait 120
setpos 0 16 60 0 0
setang 0 0
give rifle
slot 1
wait 30
attach optic scope_8x
anim_lod_lineup
set r_lod_debug 1
wait 60
char_list
screenshot lod_scope_hip.png
wait 3
+aim
wait 90
char_list
classic_stats
screenshot lod_scope_ads.png
wait 3
set r_lod_debug 2
setang 25 1
wait 60
screenshot lod_scope_forest.png
wait 3
set r_lod_debug 1
setang 0 0
-aim
wait 60
char_list
screenshot lod_scope_out.png
wait 3
quit
