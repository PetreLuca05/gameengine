// Looks (docs/LOOKS.md): every look in the dev room hall and the weather yard at noon, golden hour,
// under overcast and in a storm; the HUD hidden (photo mode), screenshots into build/bin/shots/looks/.
// Run from build/bin: deadground --test --nosound --log looks.log --script ../../tools/tests/looks.cfg
r_maxfps 60
wait 60
time_pause 1
photomode 1
setpos 0 0.05 -6 0 0
setang 0 2
time_set 12:00
weather_set clear 0
wait 30
look realism
wait 8
screenshot shots/looks/hall_noon_realism.png
wait 2
look pubg
wait 8
screenshot shots/looks/hall_noon_pubg.png
wait 2
look cinematic
wait 8
screenshot shots/looks/hall_noon_cinematic.png
wait 2
look vibrant
wait 8
screenshot shots/looks/hall_noon_vibrant.png
wait 2
look gritty
wait 8
screenshot shots/looks/hall_noon_gritty.png
wait 2
