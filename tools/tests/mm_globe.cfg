// Maps tab globe (docs/MENU_GLOBE.md "Verification"): the idle globe, the flight to New York
// (the US overview mid-way), the New York and Constanța locks, a second Constanța county map (one
// leg). Every step logs "mm_globe_dump" (phase, view, highlight, lock, tiles, height).
// Run: deadground --test --menu --nosound --log mm_globe.log --script tools/tests/mm_globe.cfg
// Screenshots: mm_globe_*.png in the working directory. A slow GPU stretches the flights (the
// globe runs on wall-clock time): mm_globe_finish ends one before its screenshot.
set r_maxfps 60
wait 30
ui_nav accept
wait 4
mm_tab maps
wait 10
mm_globe_dump
screenshot mm_globe_idle.png
wait 2
mm_map story_01
wait 10
mm_globe_dump
screenshot mm_globe_overview.png
wait 2
mm_globe_finish
wait 10
mm_globe_dump
screenshot mm_globe_new_york.png
wait 2
mm_map devroom
wait 2
mm_globe_finish
wait 10
mm_globe_dump
screenshot mm_globe_constanta.png
wait 2
mm_map vegetation
wait 2
mm_globe_finish
wait 10
mm_globe_dump
screenshot mm_globe_harsova.png
wait 2
quit
