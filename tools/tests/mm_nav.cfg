// Main menu navigation (docs/MENU_LOBBY.md "Verification"): keyboard 1-7, Q / E, pad LB / RB, mouse,
// the browser, Back, the quit prompt (cancelled). Every step logs "mm_dump" (grep it) and a screenshot.
// Run: deadground --test --menu --nosound --log mm_nav.log --script tools/tests/mm_nav.cfg
// Screenshots go to SHOTS (edit) - the checker: tools/tests/mm_nav_check.sh mm_nav.log
set r_maxfps 60
wait 30
ui_nav accept
wait 4
mm_dump
screenshot mm_play.png
wait 2
ui_key 2
wait 4
mm_dump
screenshot mm_player.png
wait 2
ui_key 3
wait 4
mm_dump
screenshot mm_cosmetics.png
wait 2
ui_nav tab_next pad
wait 4
mm_dump
screenshot mm_maps.png
wait 2
mm_map vegetation winter 21 snow
wait 6
mm_dump
screenshot mm_maps_winter.png
wait 2
ui_key E
wait 4
mm_dump
screenshot mm_settings.png
wait 2
ui_key 7
wait 4
mm_dump
screenshot mm_credits.png
wait 2
ui_key Q
wait 4
mm_dump
ui_nav back
wait 4
mm_dump
mm_tab browser
wait 4
mm_dump
screenshot mm_browser.png
wait 2
ui_nav back
wait 4
mm_dump
ui_nav back
wait 4
ui_screen
screenshot mm_quit.png
wait 2
ui_nav back
wait 4
mm_dump
ui_mouse 0.075 0.062
wait 2
ui_mouse 0.075 0.062 click
wait 4
mm_dump
quit
