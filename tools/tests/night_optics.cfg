// Night optics end to end on the dev room's range (docs/NIGHT_OPTICS.md): the goggles at night (ABC,
// whiteout from the own muzzle flash and its recovery), the thermal scope at night and at noon (AGC
// range, the spot meter on a person, on a zombie, on the glass pane in front of a person, on the
// polished plate that mirrors the sky), zombie vs human body heat, a warm car. Screenshots of each.
// tools/tests/night_optics_check.py reads the nvg_debug / thermal_debug / thermal_probe lines.
//   cd build/bin && ./deadground --test --nosound --log optics.log --script ../../tools/tests/night_optics.cfg
//   python3 ../../tools/tests/night_optics_check.py optics.log
set r_maxfps 60
wait 5
nvg_range 23:30
time_pause 1
wait 8
inv_clear
give rifle
give ammo_rifle 120
give nvg
wield rifle
wait 10
// 1: the goggles: settle, then fire (the flash washes the tube out), then recover
nvg 1
wait 20
nvg_debug
screenshot night_optics_nvg.png
wait 2
+attack
wait 3
nvg_debug
-attack
wait 30
nvg_debug
nvg 0
wait 20
// 2: the thermal scope at night: a person, a zombie, the glass pane, the metal plate
attach optic scope_thermal
setpos 161 0.05 64.5 0 -10
wait 4
+aim
wait 30
thermal_debug
screenshot night_optics_thermal_person.png
wait 2
setpos 167 0.05 63.5 0 -10
wait 12
thermal_debug
setpos 172 0.05 71.5 0 -8
wait 12
thermal_debug
screenshot night_optics_thermal_glass.png
wait 2
setpos 176.5 0.05 73.5 0 -21
wait 12
thermal_debug
setpos 166 0.05 76 0 -5
wait 12
thermal_debug palette 3
wait 4
thermal_debug
screenshot night_optics_thermal_yard.png
wait 2
thermal_probe optics_human
thermal_probe optics_zombie
-aim
wait 10
// 3: noon: the scope still works (thermal needs no light); the goggles white out and shut off
time_set 12:30 instant
wait 6
thermal_debug palette 0
+aim
wait 30
thermal_debug
screenshot night_optics_thermal_day.png
wait 2
-aim
wait 10
nvg 1
wait 40
nvg_debug
nvg_report
quit
