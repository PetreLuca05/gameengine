// Night vision seen by a client: the host's replicated goggles / illuminator (EF_NVG, EF_NVG_IR) while
// they are down, the client's own goggles show the host's illuminator; off again later.
set r_maxfps 60
wait 60
give nvg
wait 500
setpos 166 0.05 70 180 0
lookat 166 1.6 78
nvg 1
wait 200
nvg_report
screenshot nvg_net_client.png
wait 500
nvg_report
quit
