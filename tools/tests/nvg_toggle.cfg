// Night vision goggles, single machine (docs/NIGHT_OPTICS.md "Gameplay rules"): 8 does nothing without an
// nvg, toggles with one that has charge, not with an empty battery; ADS is refused while the goggles are
// down; a battery_aa replaces an empty battery; an empty battery switches them off.
// tools/tests/nvg_check.py reads the nvg_report / nvg_battery lines.
//   cd build/bin && ./deadground --test --nosound --log nvg.log --script ../../tools/tests/nvg_toggle.cfg
//   python3 ../../tools/tests/nvg_check.py nvg.log
set r_maxfps 60
wait 10
time_pause 1
inv_clear
give rifle
wield rifle
wait 10
// 1: no goggles
ui_key 8
wait 4
nvg_report
// 2: goggles with charge: on, no ADS
give nvg
give battery_aa 2
wait 4
ui_key 8
wait 6
+aim
wait 30
nvg_report
-aim
// 3: off again: ADS works after the flip up
ui_key 8
wait 50
+aim
wait 40
nvg_report
-aim
wait 10
// 4: an empty battery: 8 refuses, the swap fills it, 8 works
nvg_battery 0
wait 4
ui_key 8
wait 6
nvg_report
nvg_recharge
wait 4
nvg_battery
ui_key 8
wait 6
nvg_report
// 5: the battery runs out while on: off
nvg_battery 0.001
wait 300
nvg_report
nvg_battery
quit
