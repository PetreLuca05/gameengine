// Tree bark maps (docs/VGEO.md "Tree models", docs/PBR.md): trunk close-ups at a low sun on the
// vegetation showcase forests.
// Run from build/bin: deadground.exe --test --nosound --log <log> --script ../../tools/tests/pbr_bark.cfg
set r_maxfps 60
map vegetation
wait 20
time_set 18:40 instant
time_pause
set cl_camera_socket 0
set cl_fp_body 0
wait 90
setpos -84 30 -78 40 0
wait 240
screenshot pbr_veg_pine_bark.png
wait 2
setpos 84 30 -78 -40 0
wait 240
screenshot pbr_veg_broad_bark.png
wait 2
setpos -112 30 60 90 0
wait 240
screenshot pbr_veg_dead_bark.png
wait 2
quit
