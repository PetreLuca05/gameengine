// Bark map cost (docs/PBR.md, docs/VGEO.md "Tree models"): post_bench at forest trunk close-ups and a
// vegetation forests at a low sun. Run with and without build/bin/assets/treepbr and compare the
// opaque lines. Run from build/bin with --log.
set r_maxfps 0
set r_vsync 0
map vegetation
wait 30
time_set 18:40
time_pause
set cl_camera_socket 0
wait 120
setpos -84 30 -78 40 0
wait 200
post_bench 200 veg_pine
wait 260
setpos 84 30 -78 -40 0
wait 200
post_bench 200 veg_broad
wait 260
quit
