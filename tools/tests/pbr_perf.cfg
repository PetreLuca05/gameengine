// Bark map cost (docs/PBR.md, docs/VGEO.md "Tree models"): post_bench at forest trunk close-ups and a
// zombieland forest at a low sun. Run with and without build/bin/assets/treepbr and compare the
// opaque (vgeo resolve) lines. Run from build/bin with --log.
set r_maxfps 0
set r_vsync 0
map vegetation
wait 30
time_set 18:40
time_pause
set cl_camera_socket 0
wait 120
setpos -84 30 -78 40 0
wait 200
post_bench 200 veg_pine
wait 260
setpos 84 30 -78 -40 0
wait 200
post_bench 200 veg_broad
wait 260
map zombieland
wait 30
time_set 18:40
time_pause
set ow_zombies 0
wait 120
setpos -118 24 580 175 2
wait 200
post_bench 200 zl_forest
wait 260
quit
