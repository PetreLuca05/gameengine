// PBR shelf (docs/PBR.md): glTF material maps in the dev room by day and at night (the shelf lamp is
// on the light schedule), the textured ball on the legacy path (left) and as vgeo content (right: the
// classic renderer draws it with the same maps). Run from build/bin:
//   ./deadground.exe --test --nosound --log pbr.log --script ../../tools/tests/pbr_shelf.cfg
set r_maxfps 60
wait 60
time_pause 1
set cl_fp_body 0
time_set 12:00
setpos -19 0.05 -13.8 0 -12
wait 90
screenshot pbr_day.png
wait 3
setpos -18.55 0.05 -15.5 0 -24
wait 60
screenshot pbr_day_close.png
wait 3
setpos -19 0.05 -13.8 0 -12
time_set 23:30
wait 120
screenshot pbr_night.png
wait 3
setpos -18.55 0.05 -15.5 0 -24
wait 60
screenshot pbr_night_close.png
wait 3
quit
