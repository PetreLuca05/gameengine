// Surface AO / metal + tree bark maps (docs/TEXTURES.md, docs/PBR.md): port containers and cranes,
// corrugated halls, suburb brick / plaster close-ups, forest bark at a low sun; r_vgeo 1 and 0.
// Run from build/bin: deadground.exe --test --nosound --log <log> --script ../../tools/tests/pbr_surf.cfg
set r_maxfps 60
map zombieland
wait 20
time_set 11:30
time_pause
set ow_zombies 0
set cl_camera_socket 0
set cl_fp_body 0
wait 60
// port: container yard, cranes
setpos 672 5.5 700 180 0
wait 150
screenshot pbr_port_containers.png
wait 2
setpos 625 30 590 180 -6
wait 1
noclip
wait 120
screenshot pbr_port_cranes.png
wait 2
noclip
setpos 605 4 612 180 5
wait 120
screenshot pbr_port_warehouse.png
wait 2
// factory: corrugated halls / warehouses
setpos 600 90 -430 0 -25
wait 1
noclip
wait 150
screenshot pbr_factory_air.png
wait 2
noclip
setpos 547 15 -594 0 4
wait 120
screenshot pbr_factory_hall.png
wait 2
// city street, suburbs close-ups
setpos 40 16.5 -135 -90 0
wait 120
screenshot pbr_city_street.png
wait 2
setpos 40 16.5 -135 0 0
wait 90
screenshot pbr_city_wall_a.png
wait 2
setpos 40 16.5 -135 180 0
wait 90
screenshot pbr_city_wall_b.png
wait 2
setpos -600 17 -60 -60 -3
wait 120
screenshot pbr_suburbs_street.png
wait 2
setpos -600 17 -60 30 0
wait 90
screenshot pbr_suburbs_a.png
wait 2
setpos -600 17 -60 210 0
wait 90
screenshot pbr_suburbs_b.png
wait 2
// forest bark at a low sun
time_set 18:40
setpos -118 24 580 175 2
wait 200
screenshot pbr_forest_bark.png
wait 2
set r_vgeo 0
wait 120
screenshot pbr_forest_bark_novgeo.png
wait 2
set r_vgeo 1
time_set 11:30
setpos 672 5.5 700 180 0
wait 60
set r_vgeo 0
wait 120
screenshot pbr_port_containers_novgeo.png
wait 2
set r_vgeo 1
quit
