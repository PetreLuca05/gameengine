// vgeo vs classic renderer performance comparison (docs/CLASSIC_RENDERER.md): the same fixed camera stops,
// uncapped; run once as is (r_vgeo 1) and once with `+set r_vgeo 0` before --script. Run from build/bin:
//   ./deadground.exe --test --nosound --log perf.log --script ../../tools/tests/perf_compare.cfg
// then read the "perf_stop <label>" lines (avg / worst CPU frame, avg / worst GPU frame, draws, tris).
// 120 settle frames per stop (streaming, TAA), 300 measured frames.
set r_maxfps 0
set r_vsync 0
set cl_fp_body 0

// ---------------------------------------------------------------- map vegetation
map vegetation
wait 30
time_set 11:00
time_pause
wait 200
setpos 0 16 60 0 0
wait 120
perf_stop 300 veg_meadow
wait 310
setpos -100 17 -80 300 -5
wait 120
perf_stop 300 veg_pine_forest
wait 310
setpos 100 17 -80 60 -5
wait 120
perf_stop 300 veg_broadleaf
wait 310
setpos 0 16 105 180 -8
wait 120
perf_stop 300 veg_wheat
wait 310
setpos 0 200 260 0 -38
wait 1
noclip
wait 120
perf_stop 300 veg_aerial
wait 310

// ---------------------------------------------------------------- map zombieland
map zombieland
wait 30
time_set 11:30
time_pause
set ow_zombies 0
wait 200
setpos 40 16.5 -135 -90 0
wait 120
perf_stop 300 zl_city_street
wait 310
setpos -600 17 -60 -60 -3
wait 120
perf_stop 300 zl_suburbs_grass
wait 310
setpos -60 18 640 180 0
wait 120
perf_stop 300 zl_forest
wait 310
setpos -600 420 1150 0 -32
wait 1
noclip
wait 120
perf_stop 300 zl_overview
wait 310

// ---------------------------------------------------------------- map devroom
map devroom
wait 30
time_set 11:30
time_pause
wait 120
setpos 0 0.1 8 0 0
wait 120
perf_stop 300 dev_hall
wait 310
setpos 0 0.1 35 180 -5
spawn_horde 200
wait 200
perf_stop 300 dev_horde_200
wait 310
despawn_horde
foliage_test_scatter 300000
wait 60
setpos 220 0.1 82 180 -4
wait 120
perf_stop 300 dev_foliage_yard
wait 310
setpos 300 12 180 -30 -20
wait 1
noclip
wait 120
perf_stop 300 dev_foliage_air
wait 310
quit
