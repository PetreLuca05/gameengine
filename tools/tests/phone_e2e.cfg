// Phone end-to-end (tools/tests/phone_e2e.sh): the Connect portal (phone_pair: the menus' modal;
// equipping never pairs) prints the pairing URL to the log; tools/tests/phone_e2e.mjs then drives
// the companion page. The game's Disconnect (the Phone card) shows Reconnect on the page; the
// page's Forget ends with the in-game phone (HUD panel).
r_maxfps 30
phone_out 1
wait 10
phone_status
phone_pair
phone_wait paired 6000
wait 30
phone_status
phone_wait camera 6000
wait 60
phone_status
phone_wait gallery 6000
wait 30
phone_status
phone_wait home 6000
wait 10
phone_disconnect
wait 5
phone_card
phone_wait paired 6000
wait 10
phone_card
phone_wait local 6000
wait 30
phone_status
phone_card
phone_stream_stats
quit
