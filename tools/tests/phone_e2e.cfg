// Phone end-to-end (tools/tests/phone_e2e.sh): the Connect portal (phone_pair: the menus' modal;
// equipping never pairs) prints the pairing URL to the log; tools/tests/phone_e2e.mjs then drives
// the companion page. The game's Disconnect (the Phone card) shows Reconnect on the page; the
// page's Forget ends with the in-game phone (HUD panel). The script only waits for states that
// last (the page may be faster than the game: a slow renderer must not miss a transient app).
r_maxfps 30
phone_out 1
wait 10
phone_status
phone_pair
phone_wait paired 20000
phone_wait gallery 20000
phone_status
phone_wait home 20000
wait 2
phone_disconnect
wait 2
phone_card
phone_wait paired 20000
wait 2
phone_card
phone_wait local 20000
wait 4
phone_status
phone_card
phone_stream_stats
quit
