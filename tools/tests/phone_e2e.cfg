// Phone end-to-end (tools/tests/phone_e2e.sh): equipping the phone opens the Connect portal and
// prints the pairing URL to the log; tools/tests/phone_e2e.mjs then drives the companion page
// (no key presses: pairing starts on equip, the phone is always raised).
r_maxfps 30
phone_out 1
wait 10
phone_status
phone_wait paired 6000
wait 30
phone_status
phone_wait camera 6000
wait 60
phone_status
phone_wait gallery 6000
wait 30
phone_status
phone_wait lost 6000
wait 30
phone_status
phone_stream_stats
quit
