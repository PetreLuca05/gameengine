// Phone flow (docs/PHONE.md "Phone flow"): equip -> server + pairing in one tick, the Connect
// portal on the HUD panel, decline -> home screen, Camera -> photo -> Gallery shows it, the
// viewer, no "hold right mouse" (the phone is raised without +aim). Screenshots: phone_flow_*.png.
// Run (build/bin): deadground --test --nosound --log phone_flow.log +set net_port 27391 +set phone_port 47391 --script ../../tools/tests/phone_flow.cfg
// Checked by tools/tests/phone_flow.py.
set r_maxfps 60
set sv_cheats 1
set r_mode 0
set r_width 1600
set r_height 900
vid_restart
time_set 12:00
time_pause 1
weather_set clear 0
wait 60
setpos 2 0 6 180 -4
wait 5
phone_status
phone_out 1
wait 1
phone_status
wait 40
phone_status
screenshot phone_flow_portal.png
wait 2
// Decline: the in-game phone, home screen (the HUD panel stays).
phone_decline
wait 20
phone_status
screenshot phone_flow_home.png
wait 2
// Home -> Camera (the app grid's first entry) -> photo.
phone_button app 0
wait 30
phone_status
screenshot phone_flow_camera.png
wait 2
phone_button shutter
wait 90
phone_status
// Camera -> Home -> Gallery: the new photo is the first cell.
phone_button home
wait 5
phone_button app 1
wait 30
phone_status
screenshot phone_flow_gallery.png
wait 2
phone_button cell 0
wait 30
phone_status
screenshot phone_flow_viewer.png
wait 2
phone_back
wait 5
phone_back
wait 5
phone_status
// Re-equip skips the portal (declined this session).
phone_out 0
wait 30
phone_status
phone_out 1
wait 30
phone_status
// The HUD panel at 16:9, 21:9 and 4:3 (theme tokens + the HUD safe area only).
screenshot phone_flow_panel_1600x900.png
wait 2
set r_width 2100
set r_height 900
vid_restart
wait 40
screenshot phone_flow_panel_2100x900.png
wait 2
set r_width 1200
set r_height 900
vid_restart
wait 40
screenshot phone_flow_panel_1200x900.png
wait 2
quit
