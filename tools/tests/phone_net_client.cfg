// Phone LAN check (client, tools/tests/phone_net.sh): looks at the host holding its phone: the
// replicated pose (raised, portrait), a dark screen on the model (no screen content is sent).
set r_maxfps 60
wait 90
setpos 0 0 21.2 0 0
wait 30
lookat 0 1.45 20
wait 120
phone_status
screenshot ../phone_net_client.png
wait 2
quit
