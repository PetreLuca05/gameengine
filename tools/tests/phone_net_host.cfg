// Phone LAN check (host, tools/tests/phone_net.sh): stands in front of the client with the phone
// out (always raised), on its camera app. Its screen content stays on its own HUD panel.
set r_maxfps 60
set phone_auto_pair 0
time_set 12:00
time_pause 1
wait 30
setpos 0 0 20 180 0
phone_out 1
wait 60
phone_screen camera
wait 120
phone_status
screenshot ../phone_net_host.png
wait 400
quit
