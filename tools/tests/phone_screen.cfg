// Phone screen look (docs/PHONE.md "The in-game phone"): the white emissive screen by day and at
// night (bloom), the screen light on the hand, the off state. Screenshots: phone_screen_*.png;
// tools/tests/phone_screen.py measures them and the phone_status levels.
set r_maxfps 60
set sv_cheats 1
set r_mode 0
set r_width 1600
set r_height 900
vid_restart
set phone_auto_pair 0
weather_set clear 0
time_pause 1
time_set 12:00
wait 60
setpos 2 0 6 180 -4
phone_out 1
wait 90
phone_status
screenshot phone_screen_day.png
wait 2
time_set 23:30
wait 240
phone_status
screenshot phone_screen_night.png
wait 2
set phone_screen_light 0
wait 30
screenshot phone_screen_night_nolight.png
wait 2
set phone_screen_light 0.25
phone_screen camera
wait 60
phone_status
screenshot phone_screen_night_camera.png
wait 2
time_set 18:45
wait 240
phone_status
screenshot phone_screen_dusk.png
wait 2
quit
