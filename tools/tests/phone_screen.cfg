// The held phone model shows no screen content (docs/PHONE.md "The in-game phone"): its screen
// is dark glass by day and at night, in every app; the phone's UI is only on the HUD panel.
// Screenshots: phone_screen_*.png; tools/tests/phone_screen.py measures them.
set r_maxfps 60
set sv_cheats 1
set r_mode 0
set r_width 1600
set r_height 900
vid_restart
set phone_auto_pair 0
weather_set clear 0
time_pause 1
time_set 12:00
wait 60
setpos 2 0 6 180 -4
phone_out 1
wait 90
phone_status
screenshot phone_screen_day.png
wait 2
phone_screen camera
wait 60
phone_status
screenshot phone_screen_day_camera.png
wait 2
phone_screen home
time_set 23:30
wait 240
phone_status
screenshot phone_screen_night.png
wait 2
quit
