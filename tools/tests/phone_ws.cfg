// Phone flow with a simulated device (tools/tests/phone_ws.py, a Python stdlib WebSocket client):
// equip -> portal -> the device connects (HUD panel removed, orientation drives the phone) ->
// the page opens Camera, takes a photo, opens Gallery -> the device disconnects (the panel comes
// back on the portal with Reconnect). Screenshots: phone_ws_*.png.
set r_maxfps 60
set sv_cheats 1
set r_mode 0
set r_width 1600
set r_height 900
vid_restart
time_set 12:00
time_pause 1
wait 60
setpos 2 0 6 180 -4
phone_out 1
wait 1
phone_status
wait 20
screenshot phone_ws_portal.png
wait 2
phone_wait paired 4000
wait 40
phone_status
screenshot phone_ws_paired.png
wait 2
phone_wait camera 4000
wait 90
phone_status
screenshot phone_ws_camera.png
wait 2
phone_wait gallery 4000
wait 40
phone_status
screenshot phone_ws_gallery.png
wait 2
phone_wait lost 4000
wait 40
phone_status
screenshot phone_ws_lost.png
wait 2
quit
