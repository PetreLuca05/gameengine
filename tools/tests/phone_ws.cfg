// Phone pairing in the menus with a simulated device (tools/tests/phone_ws.py, a Python stdlib
// WebSocket client; docs/PHONE.md "Phone flow"):
//   main menu: the server is up (auto-pair), Player tab -> Phone card -> the Connect portal; the
//   device pairs in the menu (card Connected, the page's ctx "menu") -> a LAN lobby (phone flag)
//   -> the match: equip goes straight to the device (no portal, no HUD panel), Camera / photo /
//   Gallery from the page -> the device drops (toast, the panel comes back) -> the page resumes
//   (real-phone mode again) -> the pause menu's Phone card + portal. Screenshots: phone_ws_*.png.
// Run with --menu (phone_ws.py does).
set r_maxfps 60
set sv_cheats 1
set r_mode 0
set r_width 960
set r_height 540
vid_restart
wait 20
ui_nav accept
mm_tab player
wait 10
phone_card
screenshot phone_ws_card.png
wait 2
phone_pair
wait 6
phone_status
phone_card
screenshot phone_ws_portal.png
wait 2
phone_wait connected 4000
wait 4
phone_card
mm_dump
screenshot phone_ws_card_connected.png
wait 2
// The portal closes by itself after "Connected".
wait 20
phone_status
// Into a match: a LAN lobby (the phone flag in the member list), start alone.
lobby_host lan
mm_tab play
wait 10
lobby_status
screenshot phone_ws_lobby.png
wait 2
lobby_ready 1
lobby_start
lobby_wait state in_game
wait 20
time_set 12:00 instant
time_pause 1
setpos 2 0 6 180 -4
phone_card
phone_out 1
wait 1
phone_status
wait 10
phone_status
screenshot phone_ws_match.png
wait 2
phone_wait camera 4000
wait 30
phone_status
screenshot phone_ws_camera.png
wait 2
phone_wait gallery 4000
wait 10
phone_status
// The device drops mid-match: toast + the HUD panel.
phone_wait local 4000
wait 2
phone_status
phone_card
screenshot phone_ws_dropped.png
wait 2
// The page resumes with its session: real-phone mode again, silently.
phone_wait paired 4000
wait 4
phone_status
// The pause menu: the Phone card, and the portal from it.
menu pause
wait 6
screenshot phone_ws_pause.png
wait 2
phone_pair
wait 6
phone_status
screenshot phone_ws_pause_portal.png
wait 2
phone_portal close
wait 2
phone_status
menu close
wait 2
quit
