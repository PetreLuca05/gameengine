// The next launch (tools/tests/phone_ws.py, docs/PHONE.md "Phone flow"): the stored device's
// session is restored when the server starts with the main menu; the page (still open) resumes
// on its own. Then Forget device: the session ends, the stored device is deleted.
set r_maxfps 60
set r_mode 0
set r_width 960
set r_height 540
vid_restart
wait 10
ui_nav accept
phone_card
phone_wait connected 4000
wait 4
phone_card
phone_forget
wait 4
phone_card
quit
