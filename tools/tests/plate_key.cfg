// V puts an armor plate in (docs/DAMAGE.md "Armor", ACT_PLATE): the first plate carried goes into the
// hands and is used at once; the armor full / no plates cases only say so. tools/tests/plate_key_check.py
// reads the "status" lines.
//   cd build/bin && ./deadground --test --nosound --script ../../tools/tests/plate_key.cfg
set r_maxfps 60
wait 60
time_pause 1
inv_clear
give rifle
give plate_carrier
give armor 3
setpos 0 0.05 22 0 0
wield rifle
wait 30
status
// The HUD shows the key next to the armor bar while a plate would go in.
screenshot plate_key_hint.png
wait 2
// Three plates in, one press each (2.5 s per plate).
ui_key V
wait 200
status
ui_key V
wait 200
status
ui_key V
wait 200
status
// No plates left: nothing happens (a hint), the armor stays.
ui_key V
wait 60
status
// Without the carrier: 1 plate max. Off with it, one plate given: full, a press only hints.
inv_clear
give rifle
give armor 1
wait 30
status
ui_key V
wait 60
status
quit
