set r_post_preset 1
wait 90
post_bench 240 medium
wait 250
screenshot C:/C/Game/build-alt/post_tests/post_perf_medium.png
wait 2
set r_post_preset 2
wait 90
post_bench 240 high
wait 250
screenshot C:/C/Game/build-alt/post_tests/post_perf_high.png
wait 2
set r_post_preset 3
wait 90
post_bench 240 ultra
wait 250
screenshot C:/C/Game/build-alt/post_tests/post_perf_ultra.png
wait 2
quit
