// generated by gen_post_tests.py: GPU ms per preset at 1920x1080
set r_mode 0
set r_width 1920
set r_height 1080
vid_restart
wait 60
setpos -16.5 0.05 -22.5 70 -8
set r_post_profile 1
set r_vsync 0
set r_maxfps 0
wait 60
set r_post_preset 0
wait 90
post_bench 240 low
wait 250
