// Recoil + crosshair verification: mag dumps at the recoil wall with the debug overlay.
// Every locally predicted bullet is checked against its cone, each dump logs PASS / FAIL.
wait 20
set wpn_recoil_debug 2
give ammo_rifle 90
// AR, 25 m, ADS, full auto
wpn_magdump rifle 25 1
wait 100
screenshot C:/C/Game/build/t_recoil_ar_firing.png
wait 150
screenshot C:/C/Game/build/t_recoil_ar_wall.png
// AR hip fire at 10 m (wide cone, crosshair gap)
wpn_magdump rifle 10 0
wait 70
screenshot C:/C/Game/build/t_recoil_ar_hip.png
wait 160
// fire mode cycle: auto -> burst
+firemode
wait 2
-firemode
wait 10
wpn_magdump rifle 25 1
wait 260
screenshot C:/C/Game/build/t_recoil_ar_burst.png
// SMG hip, 10 m
wpn_magdump smg 10 0
wait 200
screenshot C:/C/Game/build/t_recoil_smg.png
// LMG crouched? (ADS) 50 m
wpn_magdump lmg 50 1
wait 300
screenshot C:/C/Game/build/t_recoil_lmg_firing.png
wait 500
// DMR 50 m ADS, holding breath
wpn_magdump dmr 50 1
+sprint
wait 200
-sprint
screenshot C:/C/Game/build/t_recoil_dmr.png
wait 60
// Sniper 50 m
wpn_magdump sniper 50 1
wait 470
screenshot C:/C/Game/build/t_recoil_sniper.png
wait 30
// Shotgun hip at 10 m: circle crosshair = pellet cone
wpn_magdump shotgun 10 0
wait 45
screenshot C:/C/Game/build/t_recoil_shotgun.png
wait 400
// Pistol 10 m ADS
wpn_magdump pistol 10 1
wait 200
screenshot C:/C/Game/build/t_recoil_pistol.png
wait 10
quit
