// Recoil hip vs ADS (docs/RECOIL.md): ADS mag-dumps for every sight with maximum kick, the reticle
// centre must stay on the aim (sight_test recoil); hip vs ADS camera climb from getpos.
wait 90
time_pause 1
time_set 13:00 instant
set r_motion_blur 0
set r_maxfps 60
set wpn_kick_scale 3
infinite_ammo
give rifle
give pistol
wait 5
slot 1
setpos -22 0.05 -6 0 0
wait 30
attach optic none
lookat -22 1.3 -12.5
wait 20
getpos
+attack
wait 120
screenshot C:/C/Game/build/shots/RC_hip_rifle.png
