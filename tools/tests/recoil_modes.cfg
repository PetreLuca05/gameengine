// Fire modes + measured RPM: AUTO, then B (firemode) -> BURST, then B -> SINGLE.
wait 20
wpn_magdump rifle 25 1
wait 220
+firemode
wait 2
-firemode
wait 5
wpn_magdump rifle 25 1
wait 400
+firemode
wait 2
-firemode
wait 5
wpn_magdump rifle 25 1
wait 400
wpn_magdump smg 10 0
wait 220
wpn_magdump lmg 50 1
wait 700
quit
