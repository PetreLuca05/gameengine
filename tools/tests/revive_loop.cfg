// Revive loop on one machine (docs/REVIVE.md "Tests"): a client-less teammate is knocked down and
// revived, killed (corpse), its DNA extracted, inserted into a fabricator and reconstructed.
// Check the log: revive_dump lines. The timed actions and the reconstruction are waited for by state
// (revive_wait ... acted / fab <progress>): frame counts differ by far between a GPU and lavapipe.
set r_maxfps 60
set sv_cheats 1
set sv_respawn_mode 1
wait 20
spawn_teammate Alex 1.6
wait 5
down 1
wait 5
revive_dump
screenshot SHOTDIR/revive_01_downed.png
wait 2
revive_approach downed 1.0
wait 3
+use
wait 20
screenshot SHOTDIR/revive_02_reviving.png
wait 2
revive_wait 0 acted 1800
-use
wait 5
revive_dump
kill 1
wait 40
revive_dump
screenshot SHOTDIR/revive_03_corpse.png
wait 2
revive_approach corpse
wait 3
+use
wait 12
screenshot SHOTDIR/revive_04_extracting.png
wait 2
revive_wait 0 acted 1200
-use
wait 5
revive_dump
revive_approach fab
wait 3
+use
wait 20
screenshot SHOTDIR/revive_05_inserting.png
wait 2
revive_wait 0 acted 1200
-use
wait 5
revive_dump
setpos 6.3 0.05 23.0 -83 0
revive_wait fab 0.3 1800
screenshot SHOTDIR/revive_06_reconstructing.png
wait 2
revive_dump
revive_wait fab 0.7 1800
screenshot SHOTDIR/revive_07_reconstructing_late.png
wait 2
revive_dump
revive_wait 1 alive 2400
wait 30
revive_dump
screenshot SHOTDIR/revive_08_respawned.png
wait 2
quit
