// Revive loop over the network: the client (slot 1) is the one knocked down / reconstructed. 60 ms
// fake lag: the timed rings are predicted on the reviver and follow the host here.
set r_maxfps 60
set net_fakelag 60
set death_impact_debug 1
revive_wait 1 downed 6000
wait 10
screenshot SHOTDIR/net_client_downed.png
revive_dump
death_dump
revive_wait 1 alive 1800
wait 3
revive_dump
death_dump
revive_wait 1 dead 1800
wait 1
death_dump
wait 2
death_dump
wait 4
death_dump
screenshot SHOTDIR/net_client_death.png
revive_wait 1 reconstructing 6000
wait 10
screenshot SHOTDIR/net_client_spectator_reconstructing.png
revive_dump
revive_wait 1 alive 2400
wait 10
revive_dump
death_dump
screenshot SHOTDIR/net_client_back.png
wait 30
quit
