// Revive loop over the network (docs/REVIVE.md "Tests"), host side (slot 0). The client (slot 1,
// revive_net_client.cfg) is knocked down and revived, killed, its DNA extracted, inserted into the
// dev room fabricator and reconstructed; a late joiner (revive_net_late.cfg) checks the progress.
set r_maxfps 60
set sv_cheats 1
set sv_respawn_mode 1
revive_wait players 2 6000
wait 60
setpos 0 0.05 24 0 0
down 1
wait 20
revive_dump
revive_approach downed 1.0
wait 3
+use
wait 15
screenshot SHOTDIR/net_host_reviving.png
revive_wait 1 alive 1200
-use
wait 10
revive_dump
kill 1
revive_wait 1 dead 600
wait 60
revive_dump
revive_approach corpse
wait 3
+use
wait 50
-use
wait 5
revive_dump
revive_approach fab
wait 3
+use
revive_wait 1 reconstructing 1200
-use
revive_dump
setpos 6.3 0.05 23.0 -83 0
wait 15
screenshot SHOTDIR/net_host_reconstructing.png
revive_dump
revive_wait 1 alive 2400
wait 10
revive_dump
screenshot SHOTDIR/net_host_client_back.png
wait 200
quit
