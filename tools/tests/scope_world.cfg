// The scope picture-in-picture sees the world like the main view (docs/ATTACHMENTS.md "The PiP
// pass"): world FOV hip vs ADS (irons / red dot: the slight ADS world zoom), then a 4x scope by day,
// in rain + fog, at night with the flashlight, after shooting the 25 m target (impacts, decals,
// smoke), and through the lens at a uniform fog wall (tools/tests/scope_match.py compares the lens
// with the world around it). Screenshots into shots/scope/ (run from build/bin):
//   deadground --test --nosound --log scope.log --script ../../tools/tests/scope_world.cfg
set dev_fixed_fps 60
set r_maxfps 60
set wpn_sway_scale 0
set wpn_kick_scale 0
set cam_kick_scale 0
wait 60
time_set 13:00 instant
infinite_ammo
give rifle
wait 5
slot 1
attach optic none
setpos 32 0.05 -8 -90 0
wait 5
setang -90 -1
wait 40
screenshot shots/scope/irons_hip.png
wait 2
+aim
wait 50
screenshot shots/scope/irons_ads.png
wait 2
-aim
attach optic red_dot
wait 30
screenshot shots/scope/reddot_hip.png
wait 2
+aim
wait 50
screenshot shots/scope/reddot_ads.png
wait 2
-aim
attach optic scope_4x
setang -73 0.3
wait 30
+aim
wait 50
screenshot shots/scope/4x_day.png
wait 2
// impacts + muzzle smoke on the 25 m target
+attack
wait 20
-attack
wait 6
screenshot shots/scope/4x_day_shots.png
wait 2
// rain + fog
weather_set rain 0
weather_params fog_density 0.03 fog_height 40 time 0
weather_surface 1 0.8 0
wait 60
screenshot shots/scope/4x_rain_fog.png
wait 2
+attack
wait 15
-attack
wait 6
screenshot shots/scope/4x_rain_fog_shots.png
wait 2
// night, flashlight
time_set 23:30 instant
flashlight 1
wait 60
screenshot shots/scope/4x_night_rain_fog.png
wait 2
+attack
wait 15
-attack
wait 6
screenshot shots/scope/4x_night_shots.png
wait 2
// lens vs world: a uniform fog wall by day (the open field south of the hall); no screen vignette
// (it darkens the screen edges the world samples come from, not the lens in the centre)
set r_vignette 0
flashlight 0
time_set 13:00 instant
weather_set fog 0
weather_params fog_density 0.06 fog_height 40 time 0
weather_surface 0 0 0
setpos 0 0.05 30 0 0
wait 5
setang 180 2
wait 60
screenshot shots/scope/4x_fog_match.png
wait 2
-aim
wait 30
quit
