// Sighting-in lane: 1 MOA targets at 10 / 25 / 50 / 100 / 200 m through the red dot / 4x / 8x,
// the bench UI, a remote-view check of the mounted optic (third person).
wait 60
give rifle
wield rifle
setpos 32 0.05 -8 -90 0
wait 40
screenshot C:/C/Game/build/shots/lane_overview.png
wait 3
attach optic red_dot
wait 10
+aim
wait 40
screenshot C:/C/Game/build/shots/lane_reddot_50.png
wait 3
-aim
attach optic scope_4x
wait 10
lookat 132 1.6 -13
+aim
wait 40
screenshot C:/C/Game/build/shots/lane_4x.png
wait 3
-aim
attach optic scope_8x
wait 10
lookat 232 2.2 -1
+aim
wait 40
screenshot C:/C/Game/build/shots/lane_8x.png
wait 3
set ads_debug 1
wait 3
screenshot C:/C/Game/build/shots/lane_8x_debug.png
wait 3
set ads_debug 0
-aim
wait 20
bench
wait 10
screenshot C:/C/Game/build/shots/lane_bench.png
wait 3
bench
set cl_thirdperson 1
attach muzzle suppressor
setang -60 -5
wait 30
screenshot C:/C/Game/build/shots/lane_thirdperson.png
wait 3
quit
