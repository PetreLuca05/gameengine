// Sight tests: parallax (red dot), replication encoder round trip, aspect ratios, FOV / DoF switch
// exactly at ADS completion (iron, red dot, 4x and 8x scopes; the world FOV follows the ADS world zoom).
set wpn_sway_scale 0
set wpn_kick_scale 0
wait 60
sight_test parallax
sight_test net
give rifle
slot 1
setpos 32 0.05 -8 -90 0
wait 30
sight_test fov
+aim
wait 40
sight_test aspect
-aim
wait 30
attach optic red_dot
wait 10
+aim
wait 40
sight_test aspect
-aim
wait 30
attach optic scope_4x
wait 10
+aim
wait 40
sight_test aspect
-aim
wait 30
attach optic scope_8x
wait 10
+aim
wait 40
sight_test aspect
-aim
wait 30
sight_test_report
quit
