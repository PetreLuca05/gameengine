// Attachment replication over LAN (client): mounts a red dot + vertical grip through RPC_ATTACH,
// dumps what it received for the host's weapon and screenshots the host player.
wait 420
slot 1
wait 30
attach optic red_dot
attach underbarrel vertical_grip
wait 200
sight_test dump
lookat 0 1.2 24
wait 30
screenshot C:/C/Game/build/shots/net_client_view.png
wait 120
quit
