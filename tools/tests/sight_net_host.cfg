// Attachment replication over LAN (host). Run with sight_net_client.cfg: .toolchain/snet.sh
set cl_name Host
wait 60
give rifle
slot 1
attach optic scope_8x
attach muzzle suppressor
wait 360
give rifle 1 1
give ammo_rifle 60 1
wait 360
sight_test dump
lookat 2 1.2 24.5
set cl_thirdperson 0
wait 30
screenshot C:/C/Game/build/shots/net_host_view.png
wait 120
quit
