// Weapon sights: rifle with iron sights, red dot, 4x and 8x (PiP), hip + ADS (the world FOV never
// changes, scopes magnify only inside the lens). Screenshots into build/shots/.
wait 60
give rifle
slot 1
setpos 0 0.05 22 0 0
setang 0 0
wait 40
attach
screenshot C:/C/Game/build/shots/sight_iron_hip.png
wait 3
+aim
wait 40
screenshot C:/C/Game/build/shots/sight_iron_ads.png
wait 3
-aim
attach optic red_dot
wait 30
screenshot C:/C/Game/build/shots/sight_reddot_hip.png
wait 3
+aim
wait 40
set ads_debug 1
wait 3
screenshot C:/C/Game/build/shots/sight_reddot_ads.png
wait 3
set ads_debug 0
-aim
attach optic scope_4x
wait 30
screenshot C:/C/Game/build/shots/sight_4x_hip.png
wait 3
+aim
wait 40
screenshot C:/C/Game/build/shots/sight_4x_ads.png
wait 3
-aim
attach optic scope_8x
wait 30
+aim
wait 40
screenshot C:/C/Game/build/shots/sight_8x_ads.png
wait 3
-aim
attach muzzle suppressor
attach underbarrel vertical_grip
attach magazine extended_mag
attach stock heavy_stock
wait 30
setang 30 -5
wait 20
screenshot C:/C/Game/build/shots/sight_all_hip.png
wait 3
attach
inv
quit
