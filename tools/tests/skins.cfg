// Skins: armed NPCs (officer), target dummies (athlete), zombies (their own), the player
// (third person: default hazmat, then casual via cl_skin), the pause menu skin page.
wait 40
setpos 8.4 0.05 -9 180 -5
wait 30
screenshot C:/C/Game/build-alt/sk_npcs.png
wait 3
setpos -20 0.05 19 180 0
wait 30
screenshot C:/C/Game/build-alt/sk_dummies.png
wait 3
zombie_spawn 3
wait 60
screenshot C:/C/Game/build-alt/sk_zombies.png
wait 3
setpos 0 0.05 20 0 0
set cl_thirdperson 1
wait 30
screenshot C:/C/Game/build-alt/sk_player_default.png
wait 3
set cl_skin casual
wait 20
screenshot C:/C/Game/build-alt/sk_player_casual.png
wait 3
set cl_thirdperson 0
give rifle
wield rifle
wait 40
screenshot C:/C/Game/build-alt/sk_fp_arms.png
wait 3
menu skin
wait 10
screenshot C:/C/Game/build-alt/sk_menu.png
wait 3
quit
