// Spectating LAN test (tools/tests/spec_net.sh, docs/SPECTATE.md "Tests"): the host. Slot 1 = the
// target, slot 2 = the observer. Times are host seconds (the target joins at 4 s, the observer at 6 s).
set r_maxfps 60
set cl_name Host
set sv_cheats 1
set sv_respawn_mode 1
set net_fakelag 80
set net_fakeloss 3
wait 420
give rifle 1 1
give ammo_rifle 180 1
give sniper 1 1
give ammo_762 60 1
give medkit 2 1
// 8 s: the observer dies -> death camera -> spectating
wait 60
kill 2
wait 300
status
net_snapstats
// 30.5 s: the target into the car in the vehicle yard
wait 1050
setpos -140 0.1 6
wait 30
vehicle_put 1 0
wait 600
net_snapstats
status
wait 300
quit
