// Spectating LAN test: the observer (observer time = host time - 6 s). Dies at host 8 s, the death
// camera (1 s) hands over to auto spectating, then it picks the target (slot 1) and screenshots
// the target's moments (a little later: the spectator delay).
set r_maxfps 60
set cl_name Observer
set spec_death_cam_time 1
set spec_dump 1
set net_fakelag 80
set net_fakeloss 3
wait 210
spectate 1 eye
wait 160
screenshot ../spec_o_ads.png
wait 102
screenshot ../spec_o_magdump.png
wait 210
screenshot ../spec_o_reload.png
wait 280
screenshot ../spec_o_scope.png
wait 182
screenshot ../spec_o_use.png
wait 182
screenshot ../spec_o_phone.png
// cycling and third person must not touch the target (and come back to it)
wait 20
+attack
wait 2
-attack
wait 30
spectate 1 third
wait 60
screenshot ../spec_o_third.png
wait 2
spectate 1 eye
wait 455
screenshot ../spec_o_drive.png
wait 200
spectate
wait 300
quit
