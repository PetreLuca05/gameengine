// Spectating rules on a lone host (docs/SPECTATE.md "Validation"): illegal targets are refused
// with a reason, the host's own player may spectate while alive (dev), the free camera works with
// nobody to watch, "off" returns to playing.
set r_maxfps 60
wait 60
spectate 0
wait 5
spectate 6
wait 5
spectate next
wait 5
spectate free
wait 30
spectate
spectate off
wait 5
spectate
set sv_spec_allowed 0
spectate free
wait 5
spectate
set sv_spec_allowed 1
quit
