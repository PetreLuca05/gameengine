// Spectating LAN test: the watched player (target time = host time - 4 s). Logs a per-tick state
// hash (spec_dump) that spec_compare.py matches against the observer's replica, and screenshots
// the same moments as the observer.
set r_maxfps 60
set cl_name Target
set spec_dump 1
set net_fakelag 80
set net_fakeloss 3
wait 420
// 7 s: rifle, aim in (ADS), 8 s: magazine dump (recoil, spread, hit markers on the wall)
wield rifle
setang 0 0
+aim
wait 48
screenshot ../spec_t_ads.png
wait 12
+attack
wait 90
screenshot ../spec_t_magdump.png
wait 120
-attack
-aim
wait 30
// 12 s: reload (timed ring)
+reload
wait 2
-reload
wait 46
screenshot ../spec_t_reload.png
wait 130
// 15 s: sniper, 16 s: scope (PiP)
wield sniper
wait 60
+aim
wait 90
screenshot ../spec_t_scope.png
wait 30
-aim
wait 30
// 18 s: medkit (use ring)
wield medkit
wait 40
+attack
wait 60
screenshot ../spec_t_use.png
wait 80
-attack
// 21 s: phone camera mode
phone_out 1
wait 30
phone_zoom 3
+aim
wait 60
screenshot ../spec_t_phone.png
wait 30
-aim
phone_out 0
// 24 s: walk / jump
+forward
wait 40
+jump
wait 2
-jump
wait 60
-forward
// 26.5 s .. the host seats us at 30.5 s; 31.5 s: drive
wait 300
+forward
wait 60
+right
wait 60
screenshot ../spec_t_drive.png
wait 60
-right
wait 60
-forward
wait 60
vehicle_exit
wait 120
quit
