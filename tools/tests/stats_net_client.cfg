// Player statistics over LAN: the client (slot 1). It fires the rifle the host gives it; its combat
// numbers arrive from the host (stats_flush) and it reports its own public stats to the host.
set r_maxfps 60
revive_wait players 2 6000
wait 120
wield rifle
wait 30
+attack
wait 60
-attack
wait 500
stats_dump
stats_public 0
wait 60
stats_public 0
wait 200
quit
