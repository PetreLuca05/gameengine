// Player statistics over LAN (docs/STATS.md "Tests"), host side (slot 0). The client (slot 1,
// stats_net_client.cfg) fires; the host downs, revives and kills it, flushes the combat deltas,
// and asks for the client's public stats. stats_net.sh greps both logs.
set r_maxfps 60
set sv_cheats 1
revive_wait players 2 6000
wait 30
give_all 1
wait 400
down 1
wait 20
revive 1
wait 20
kill 1
wait 20
stats_flush
wait 120
stats_public 1
wait 120
stats_public 1
stats_dump
wait 300
quit
