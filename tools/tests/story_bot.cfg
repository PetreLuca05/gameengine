// Story mode end to end (docs/STORY.md "Tests"): chapter 1 from the start (all 7 days), the solver bot drives the
// chapter's events, story_time runs the story ahead (timers, waits, fallbacks) until it ends; the log
// must show "story: chapter 01_tenth_floor ended". Run with --test --nosound and story_save_dir set by
// the caller (+story_save_dir <scratch>) so the user's saves stay untouched.
r_maxfps 60
story_chapter 1
wait 5
story_bot 1
story_time 2400
wait 3
story_debug
wait 2
quit
