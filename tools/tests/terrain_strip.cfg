// Terrain transition test strip (docs/TERRAIN_SHADING.md "Test strip", data/levels/terrain_yard.json):
// three overviews of four pair rows each (borders at x = 0), then the band (r_terrain_debug 7) and the
// border distance (11) views of the first group. Run from build/bin:
//   deadground --test --nosound --log <log> --script ../../tools/tests/terrain_strip.cfg
set r_maxfps 60
map terrain_yard
wait 20
time_set 11:30
time_pause
set cl_camera_socket 0
set cl_fp_body 0
wait 20
setpos 0 34 -62 180 -60
wait 1
noclip
wait 30
screenshot terrain_strip_rows_a.png
wait 2
setpos 0 34 -22 180 -60
wait 1
noclip
wait 30
screenshot terrain_strip_rows_b.png
wait 2
setpos 0 34 18 180 -60
wait 1
noclip
wait 30
screenshot terrain_strip_rows_c.png
wait 2
setpos 0 34 -62 180 -60
wait 1
noclip
set r_terrain_debug 7
wait 30
screenshot terrain_strip_band.png
wait 2
set r_terrain_debug 11
wait 30
screenshot terrain_strip_distance.png
wait 2
set r_terrain_debug 0
setpos -3 12.5 -60 160 -28
wait 1
noclip
wait 30
screenshot terrain_strip_close.png
wait 2
quit
