// Terrain at every Engine Fidelity level (docs/TERRAIN_SHADING.md "Levels and cost"), the transition strip:
// one screenshot per level (r_fidelity sets r_terrain_quality to the level's default). Run with --validation:
//   py tools/tests/run_terrain_tests.py (checks zero validation messages and that every level renders)
set r_maxfps 60
map terrain_yard
wait 20
time_set 11:30 instant
time_pause
weather_set clear 0
weather_lock 1
set cl_camera_socket 0
set cl_fp_body 0
setpos -2 12.5 -61 160 -30
wait 1
noclip
set r_fidelity 0
wait 30
screenshot terrain_level_0.png
wait 2
set r_fidelity 1
wait 30
screenshot terrain_level_1.png
wait 2
set r_fidelity 2
wait 30
screenshot terrain_level_2.png
wait 2
set r_fidelity 3
wait 30
screenshot terrain_level_3.png
wait 2
set r_fidelity 4
wait 30
screenshot terrain_level_4.png
wait 2
set r_fidelity 4
quit
