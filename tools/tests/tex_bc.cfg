// Texture loads A / B (docs/TEXTURE_MIPS.md "Block compression"; PF-0035, PF-0024): fixed views of the
// dev room and the vegetation map (fixed sim step, no frame cap), a profile capture per map
// (vram_usage_mb, gpu_frame_ms) and the texture load lines. tools/tests/tex_bc_compare.py runs it for
// two command lines and compares; by hand, from build/bin:
//   ./deadground.exe --test --nosound --log bc.log +set r_texture_compress 1 --script ../../tools/tests/tex_bc.cfg
// writes tex_bc_<view>.png, tex_bc_dev.json and tex_bc_veg.json into the working directory.
set r_maxfps 0
set r_vsync 0
set dev_fixed_fps 60
set cl_fp_body 0
time_set 12:00 instant
time_pause 1
weather_lock 1
weather_set clear 0
wait 120

// ---------------------------------------------------------------- dev room
setpos 0 0 20 0 -3
wait 60
prof_capture 120 tex_bc_dev.json tex_bc 20
wait 150
screenshot tex_bc_dev_hall.png
wait 2
setpos 0 0 6 0 -8
wait 5
spawn_teammate Survivor 2.2
wait 5
setpos 0 0 6 0 -8
wait 90
screenshot tex_bc_dev_character.png
wait 2
tex_compress_stats

// ---------------------------------------------------------------- vegetation map
map vegetation
wait 30
set dev_fixed_fps 60
time_set 15:00 instant
time_pause 1
weather_lock 1
weather_set little_cloudy 0
wait 200
setpos 0 14.99 10 30 -5
wait 90
prof_capture 120 tex_bc_veg.json tex_bc 20
wait 150
screenshot tex_bc_veg_meadow.png
wait 2
setpos 0 14.99 10 30 -55
wait 60
screenshot tex_bc_veg_ground.png
wait 2
setpos -135 16.41 -125 0 -2
wait 90
screenshot tex_bc_veg_pine.png
wait 2
setpos -60 12.73 -110 200 -4
wait 90
screenshot tex_bc_veg_edge.png
wait 2
setpos 0 14.28 140 90 -6
wait 90
screenshot tex_bc_veg_wheat.png
wait 2
tex_compress_stats
quit
