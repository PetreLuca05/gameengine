// Surface textures + foliage (the classic renderer, docs/CLASSIC_RENDERER.md) on the
// vegetation showcase: terrain layers, grass / wheat cards, imported trees.
set r_maxfps 60
map vegetation
wait 20
time_set 11:30 instant
time_pause
set cl_camera_socket 0
set cl_fp_body 0
wait 60
setpos 0 14.7 60 0 -12
wait 150
screenshot tex_fallback_meadow.png
wait 2
setpos -60 30 -54 40 -2
wait 240   // drops to the ground first
screenshot tex_fallback_pine.png
wait 2
setpos 10 16 125 180 -18
wait 150
screenshot tex_fallback_wheat.png
wait 2
quit
