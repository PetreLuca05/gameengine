// Surface textures (docs/TEXTURES.md) frame cost: post_bench at open-world spots with r_surfaces 1 / 0.
// Run from build/bin with --log and read the post_bench lines.
set r_maxfps 0
set r_vsync 0
map zombieland
wait 30
time_set 11:30
time_pause
set ow_zombies 0
set cl_camera_socket 0
wait 120
set r_surfaces 1
setpos 40 16.5 -135 -90 0
wait 120
post_bench 200 city_street_surf1
wait 260
set r_surfaces 0
setpos 40 16.5 -135 -90 0
wait 120
post_bench 200 city_street_surf0
wait 260
set r_surfaces 1
setpos -600 17 -60 -60 -3
wait 120
post_bench 200 suburbs_surf1
wait 260
set r_surfaces 0
setpos -600 17 -60 -60 -3
wait 120
post_bench 200 suburbs_surf0
wait 260
set r_surfaces 1
setpos -60 18 640 180 0
wait 120
post_bench 200 forest_surf1
wait 260
set r_surfaces 0
setpos -60 18 640 180 0
wait 120
post_bench 200 forest_surf0
wait 260
set r_surfaces 1
setpos -600 420 1150 0 -32
wait 1
noclip
wait 120
post_bench 200 overview_surf1
wait 260
noclip
set r_surfaces 0
setpos -600 420 1150 0 -32
wait 1
noclip
wait 120
post_bench 200 overview_surf0
wait 260
noclip
set r_surfaces 1
quit
