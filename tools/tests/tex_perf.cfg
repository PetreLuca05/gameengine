// Surface textures (docs/TEXTURES.md) frame cost on the vegetation showcase: post_bench with
// r_surfaces 1 / 0 at the meadow, the pine forest and the wheat field. Run from build/bin with --log
// and read the post_bench lines.
set r_maxfps 0
set r_vsync 0
map vegetation
wait 30
time_set 11:30
time_pause
set cl_camera_socket 0
wait 120
set r_surfaces 1
setpos 0 14.7 60 0 -12
wait 120
post_bench 200 meadow_surf1
wait 260
set r_surfaces 0
wait 120
post_bench 200 meadow_surf0
wait 260
set r_surfaces 1
setpos -60 30 -54 40 -2
wait 360
post_bench 200 pine_surf1
wait 260
set r_surfaces 0
wait 120
post_bench 200 pine_surf0
wait 260
set r_surfaces 1
setpos 10 16 125 180 -18
wait 120
post_bench 200 wheat_surf1
wait 260
set r_surfaces 0
wait 120
post_bench 200 wheat_surf0
wait 260
quit
