// Surface textures (docs/TEXTURES.md) on the vegetation showcase: grass tufts, wheat, terrain.
// Run from build/bin: deadground.exe --test --nosound --log <log> --script ../../tools/tests/tex_veg.cfg
set r_maxfps 60
map vegetation
wait 20
time_set 11:30
time_pause
set cl_camera_socket 0
set cl_fp_body 0
wait 90
setpos 0 14.7 60 0 -12
wait 150
screenshot tex_veg_spawn.png
wait 2
setpos 0 14.7 60 0 -45
wait 60
screenshot tex_veg_ground.png
wait 2
setpos 0 14.7 60 180 -8
wait 120
screenshot tex_veg_back.png
wait 2
setpos 10 16 125 180 -18
wait 150
screenshot tex_veg_wheat.png
wait 2
setpos 0 120 200 0 -35
wait 1
noclip
wait 150
screenshot tex_veg_air.png
wait 2
quit
