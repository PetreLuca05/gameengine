// Surface textures (docs/TEXTURES.md): terrain, roads and buildings at eye level and from the air.
// Run from build/bin: deadground.exe --test --nosound --log <log> --script ../../tools/tests/tex_zl.cfg
set r_maxfps 60
map zombieland
wait 20
time_set 11:30
time_pause
set ow_zombies 0
set cl_camera_socket 0
set cl_fp_body 0
wait 60
setpos 40 16.5 -135 -90 0
wait 120
screenshot tex_city_street.png
wait 2
setpos -600 17 -60 -60 -3
wait 120
screenshot tex_suburbs_street.png
wait 2
setpos -650 17 -60 -60 -25
wait 120
screenshot tex_suburbs_ground.png
wait 2
setpos -118 24 580 175 -10
wait 120
screenshot tex_forest_ground.png
wait 2
setpos 600 80 260 0 -22
wait 1
noclip
wait 150
screenshot tex_farms_air.png
wait 2
setpos 0 95 180 0 -28
wait 150
screenshot tex_city_air.png
wait 2
setpos -600 420 1150 0 -32
wait 150
screenshot tex_aerial_south.png
wait 2
quit
