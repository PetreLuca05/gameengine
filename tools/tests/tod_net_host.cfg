// Time of day over LAN (host): changes the time before the client joins (late join must sync),
// then the speed while it is connected. Run with tod_net_client.cfg: .toolchain/tnet.sh
set cl_name Host
wait 30
time_set 18:30
time_scale 10
tod_test dump
wait 400
time_set 06:15
time_scale 3
wait 120
tod_test dump
wait 200
quit
