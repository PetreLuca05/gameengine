// Tree heights (docs/VGEO.md "Tree models" heights): the player (third person) beside the vegetation
// showcase forests, then a zombieland forest.
// Run from build/bin: deadground.exe --test --nosound --log <log> --script ../../tools/tests/tree_scale.cfg
set r_maxfps 60
map vegetation
wait 20
time_set 11:30
time_pause
set cl_camera_socket 0
set cl_thirdperson 1
set cl_thirdperson_dist 6
wait 90
// pine forest edge (NW), looking in
setpos -72 30 -66 40 8
wait 240
screenshot tree_scale_pine.png
wait 2
// the whole trees: farther back
set cl_thirdperson_dist 14
setpos -60 30 -54 40 -2
wait 200
screenshot tree_scale_pine_wide.png
wait 2
setpos 60 30 -54 -40 -2
wait 200
screenshot tree_scale_broad_wide.png
wait 2
set cl_thirdperson_dist 6
// broadleaf forest edge (NE)
setpos 72 30 -66 -40 8
wait 240
screenshot tree_scale_broad.png
wait 2
// dead forest (W)
setpos -100 30 60 90 8
wait 240
screenshot tree_scale_dead.png
wait 2
// meadow bushes / daisies by the spawn
setpos 0 14.7 60 0 -5
wait 150
screenshot tree_scale_meadow.png
wait 2
// the valley from the spawn, first person
set cl_thirdperson 0
setpos 0 14.7 60 0 2
wait 120
screenshot tree_scale_valley.png
wait 2
set r_vgeo 0
wait 120
screenshot tree_scale_valley_novgeo.png
wait 2
set r_vgeo 1
set cl_thirdperson 1
map zombieland
wait 20
time_set 11:30
time_pause
wait 60
setpos -100 120 600 0 6
wait 400
screenshot tree_scale_zl_forest.png
wait 2
set r_vgeo 0
wait 120
screenshot tree_scale_zl_forest_novgeo.png
wait 2
quit
