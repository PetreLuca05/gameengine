// Crate in the inventory (docs/UI.md): open the attachment crate by the weapon bench, take one item
// by dragging, take all, close with Tab.
wait 60
time_pause 1
time_set 13:00
set r_maxfps 60
give rifle
setpos 7.2 0.05 26.2 0 0
wait 20
lookat 7.2 0.4 27.6
wait 20
+use
wait 90
ui_screen
-use
wait 30
ui_screen
screenshot ui_crate.png
ui_inv_dump
ui_inv_drag_from_crate 0 15
wait 30
ui_inv_dump
ui_nav view
wait 20
ui_screen
quit
