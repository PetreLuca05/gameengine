// World containers in the inventory (docs/INVENTORY.md): open the attachment crate by the weapon
// bench (its grid above the player's on the right), drag the suppressor (crate cell 4,0) into the
// grid, take all; then the gear locker (a 10x12 stash: the two bigger packs, a helmet, a plate
// carrier and plates): put on its hiking pack (Alt+click, cell 0,0: the default bag's contents move
// over), the plate carrier by dropping it on the character, the helmet onto its slot.
wait 60
time_pause 1
time_set 13:00 instant
set r_maxfps 60
inv_clear
give rifle
setpos 7.2 0.05 26.2 0 0
wait 20
lookat 7.2 0.4 27.6
wait 20
+use
wait 90
-use
wait 30
screenshot ui_crate.png
inv_dump loot
ui_inv_drag c:loot:grid:0:4:0 c:self:grid:0:0:0
wait 30
inv_dump
inv_intent take_all loot 0
wait 20
inv_dump
ui_screen close
wait 10
setpos 9.2 0.05 26.2 0 0
wait 20
lookat 9.2 0.4 27.6
wait 20
+use
wait 90
-use
wait 30
inv_dump loot
screenshot ui_locker.png
ui_inv_click c:loot:grid:0:0:0 alt
wait 20
inv_dump
inv_dump loot
ui_inv_drag c:loot:grid:0:7:0 char
wait 20
ui_inv_drag c:loot:grid:0:4:0 e:headwear
wait 20
inv_dump
screenshot ui_locker_equipped.png
wait 2
ui_screen close
quit
