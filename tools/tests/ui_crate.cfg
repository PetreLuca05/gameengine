// Crate in the inventory (docs/INVENTORY.md): open the attachment crate by the weapon bench (the
// loot grid on the right, the hotbar row above it), drag the suppressor (1x1, crate cell 4,0) into
// the first pocket, take all, then the gear locker (a 10x12 stash: wearables, packs, cases): put on
// its hiking pack (Alt+click, cell 0,0) and its chest rig (dragged from cell 7,2 onto the rig slot).
wait 60
time_pause 1
time_set 13:00 instant
set r_maxfps 60
inv_clear
give rifle
setpos 7.2 0.05 26.2 0 0
wait 20
lookat 7.2 0.4 27.6
wait 20
+use
wait 90
-use
wait 30
screenshot ui_crate.png
inv_dump loot
ui_inv_drag c:loot:0:0:4:0 c:self:pockets:0:0:0
wait 30
inv_dump
inv_intent take_all loot 0
wait 20
inv_dump
ui_screen close
wait 10
// The gear locker: put on the hiking pack by Alt+click, the rig by dragging it onto its slot.
setpos 9.2 0.05 26.2 0 0
wait 20
lookat 9.2 0.4 27.6
wait 20
+use
wait 90
-use
wait 30
inv_dump loot
screenshot ui_locker.png
ui_inv_click c:loot:0:0:0:0 alt
wait 20
ui_inv_drag c:loot:0:0:7:2 e:tactical_rig
wait 20
inv_dump
screenshot ui_locker_equipped.png
wait 2
ui_screen close
quit
