// Inventory screen (docs/INVENTORY.md "Screen"): every mouse gesture with an inv_dump after each.
// Loadout (the pickup rule places it): the hiking pack worn over the default bag (10x8 grid), rifle
// (primary), pistol (holster), helmet, plate carrier; in the grid, row-major: medkit x2 (0,0, 2x2),
// rifle rounds (2,0), red dot (3,0, 2x1), suppressor (5,0), scrap (6,0), grenades (7,0). The cell
// addresses below are those (inv_dump after the loadout shows them).
wait 90
time_pause 1
time_set 13:00 instant
set r_maxfps 60
inv_clear
give backpack_hiking
give rifle
give pistol
give medkit 2
give ammo_rifle 90
give att_red_dot
give att_suppressor
give scrap 14
give frag_grenade 2
give helmet
give plate_carrier
wait 10
inventory
wait 30
inv_dump
screenshot ui_inventory.png
// Mount the suppressor and the red dot through the primary's attachment chips (the slot column).
ui_inv_drag c:self:grid:0:5:0 a1:muzzle
wait 10
ui_inv_drag c:self:grid:0:3:0 a1:optic
wait 10
// Both mounted: the suppressor and the red dot are gone from the grid.
inv_dump
// Inspect the rifle (double click on the primary slot): the docked inspect panel.
ui_inv_click e:primary double
wait 20
screenshot ui_inv_mount.png
// Unequip the pistol into the grid, carry it rotated (R while dragging), then drop it on the character.
ui_inv_drag e:holster c:self:grid:0:0:5
wait 10
inv_dump
ui_inv_drag c:self:grid:0:0:5 c:self:grid:0:8:4 rot
wait 10
inv_dump
ui_inv_drag c:self:grid:0:8:4 char
wait 10
inv_dump
// Shift-drag the rifle rounds: the split dialog, accepted with the default (half).
ui_inv_drag c:self:grid:0:2:0 c:self:grid:0:9:7 shift
wait 10
screenshot ui_inv_split.png
ui_nav accept
wait 10
inv_dump
// Ctrl+click quick move (the pistol: holster -> grid), the categories (highlight only), the context menu.
ui_inv_click e:holster ctrl
wait 10
inv_dump
ui_inv_cat medical
wait 5
screenshot ui_inv_category.png
inv_dump
ui_inv_cat all
ui_inv_click c:self:grid:0:0:0 right
wait 10
screenshot ui_inv_context.png
ui_nav back
wait 5
// A rejected drop (the helmet into the rifle slot) shakes and says why.
ui_inv_drag e:headwear e:primary
wait 4
screenshot ui_inv_reject.png
wait 10
// Compact the grid (the split rounds move to 7,0), then discard them onto the Discard zone.
inv_intent compact self 0 self 0
wait 10
inv_dump
ui_inv_drag c:self:grid:0:7:0 discard
wait 10
inv_dump
ui_screen close
wait 10
quit
