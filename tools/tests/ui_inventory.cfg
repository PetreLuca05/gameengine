// Inventory UI (docs/UI.md): drag and drop, mount / unmount, context menu, quick move, equip,
// drop with confirmation. Positions are window fractions at 1600x900 (inventory centred).
wait 90
time_pause 1
time_set 13:00
set r_maxfps 60
give rifle
give pistol
give medkit 2
give ammo_rifle 90
give att_red_dot
give att_scope_4x
give att_suppressor
give att_vertical_grip
give scrap 14
wait 10
inventory
wait 20
ui_inv_dump
// drag the red dot (backpack slot 2) onto the rifle in the hotbar (slot 1)
ui_inv_drag 7 0
wait 10
ui_inv_dump
screenshot ui_inv_mount.png
// the 4x scope onto the pistol: rejected (the pistol takes no scope)
ui_inv_drag 8 1
wait 10
// a suppressor onto the pistol (muzzle)
ui_inv_drag 9 1
wait 10
ui_inv_dump
// context menu on the scrap stack
ui_inv_rclick 11
wait 10
screenshot ui_inv_context.png
ui_nav back
wait 5
// split by ctrl-drag: scrap -> empty slot 17
ui_inv_drag 11 17 ctrl
wait 10
ui_inv_dump
// quick move the medkit (hotbar 3) to the backpack
ui_inv_shiftclick 2
wait 10
ui_inv_dump
// drag the vertical grip onto the pistol: rejected (no underbarrel slot)
ui_inv_drag 10 1
wait 3
screenshot ui_inv_reject.png
wait 10
// unmount the red dot: drag the optic chip out to slot 27
ui_inv_select 0
wait 5
ui_inv_drag_att 0 27
wait 10
ui_inv_dump
// drop the scope outside the panel: asks first (focus starts on Cancel)
ui_inv_drag_out 8
wait 10
screenshot ui_inv_confirm.png
ui_nav right pad
wait 2
ui_nav accept pad
wait 10
ui_inv_dump
quit
