// Inventory screen (docs/INVENTORY.md "Screen"): every mouse gesture with an inv_dump after each.
// Loadout (the pickup rule places it): hiking pack + chest rig worn, rifle (primary, hotbar 1),
// pistol (holster, hotbar 2), medkits (rig pouch 4, a 2x2, hotbar 3), rifle rounds + suppressor in
// the rig's 1x2 pouch 0 (cells 0,0 / 0,1), scrap in pouch 1 (0,0), the red dot in pouch 5 (2x2),
// helmet (headwear). The cell addresses below are those (inv_dump after the loadout shows them).
wait 90
time_pause 1
time_set 13:00
set r_maxfps 60
inv_clear
give backpack_hiking
give rig_chest
give rifle
give pistol
give medkit 2
give ammo_rifle 90
give att_red_dot
give att_suppressor
give scrap 14
give helmet
wait 10
inventory
wait 30
inv_dump
screenshot ui_inventory.png
// Inspect the rifle (double click on the primary slot), mount the suppressor and the red dot.
ui_inv_click e:primary double
wait 10
ui_inv_drag c:self:rig:0:0:1 a:muzzle
wait 10
ui_inv_drag c:self:rig:5:0:0 a:optic
wait 10
// Both mounted: the suppressor and the red dot are gone from the rig (the rifle's inspect window shows them).
inv_dump
screenshot ui_inv_mount.png
ui_nav back
wait 5
// Unequip the pistol into the backpack, then carry it back rotated (R while dragging).
ui_inv_drag e:holster c:self:backpack:0:0:0
wait 10
ui_inv_drag c:self:backpack:0:0:0 c:self:backpack:0:4:2 rot
wait 10
inv_dump
// Shift-drag the rifle rounds: the split dialog, accepted with the default (half).
ui_inv_drag c:self:rig:0:0:0 c:self:backpack:0:0:5 shift
wait 10
screenshot ui_inv_split.png
ui_nav accept
wait 10
inv_dump
// Ctrl+click quick move (scrap: rig -> backpack), the medkit onto hotbar 5, the context menu.
ui_inv_click c:self:rig:1:0:0 ctrl
wait 10
ui_inv_drag c:self:rig:4:0:0 h:5
wait 10
ui_inv_click c:self:backpack:0:0:5 right
wait 10
screenshot ui_inv_context.png
ui_nav back
wait 5
// A rejected drop (the helmet into the rifle slot) shakes and says why.
ui_inv_drag e:headwear e:primary
wait 4
screenshot ui_inv_reject.png
wait 10
// Discard the split rounds onto the Discard zone.
ui_inv_drag c:self:backpack:0:0:5 discard
wait 10
inv_dump
ui_screen close
wait 10
quit
