// Keyboard / gamepad navigation (docs/UI.md): pause -> each sub-menu -> back, with pad and keys.
wait 60
time_pause 1
set r_maxfps 60
give rifle
give att_red_dot
wait 5
ui_nav menu pad
wait 10
ui_screen
// down to Settings (Resume, Inventory, Settings) and open it
ui_nav down pad
wait 3
ui_nav down pad
wait 3
ui_nav down pad
wait 3
ui_nav accept pad
wait 15
ui_screen
// next tab twice, move down into the rows, change a slider with right
ui_nav tab_next pad
wait 5
ui_nav tab_next pad
wait 5
ui_nav down pad
wait 3
ui_nav down pad
wait 3
screenshot ui_nav_settings.png
ui_nav back pad
wait 10
ui_screen
// inventory from the stack (keyboard): the focus is back on Settings, Inventory is above
ui_nav up
wait 3
ui_nav accept
wait 15
ui_screen
// carry the red dot onto the rifle with the pad: focus starts somewhere in the grid
ui_nav accept pad
wait 5
screenshot ui_nav_inventory.png
ui_nav back pad
wait 5
ui_nav back pad
wait 10
ui_screen
ui_nav back
wait 10
ui_screen
// multiplayer, then quit dialog cancelled
ui_nav menu pad
wait 10
ui_screen multiplayer
wait 15
screenshot ui_multiplayer.png
ui_nav back
wait 5
ui_screen confirm_quit
wait 15
screenshot ui_confirm.png
ui_nav accept
wait 5
ui_screen
ui_nav back
wait 5
ui_screen
quit
