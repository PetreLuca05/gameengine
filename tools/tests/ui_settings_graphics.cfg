// Settings > Graphics (docs/UI.md "Settings > Graphics"): the one Graphics page (Engine Fidelity,
// Display with the stretched resolution and every upscaler, Comfort) scrolled through at 1920x1080,
// 1280x720, 2560x1080 and 1024x768. Then a fidelity level -> its options, one change -> Custom.
wait 60
time_pause 1
time_set 13:00 instant
set r_maxfps 60
set r_mode 0
set r_width 1920
set r_height 1080
vid_restart
wait 40
ui_screen settings:0
wait 30
screenshot gfx_1920_user_0.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_user_1.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_user_2.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_user_3.png
wait 2
ui_screen close
wait 5
// The stretched resolution and an upscaler on: their rows show what they do.
set r_stretch 0.25
set r_upscaler 2
ui_screen settings:0
wait 30
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_stretch_upscale.png
wait 2
ui_screen close
wait 5
set r_stretch 0
set r_upscaler 0
// Overall quality Medium: the simple options follow; one simple change reads Custom.
set r_fidelity 2
wait 5
ui_screen settings:0
wait 30
ui_mouse 0.5 0.6 wheel 40
wait 10
ui_mouse 0.5 0.6 wheel -9
wait 20
screenshot gfx_1920_medium.png
wait 2
set r_shadow_resolution 0
wait 10
screenshot gfx_1920_medium_custom.png
wait 2
ui_screen close
wait 5
r_defaults
set r_maxfps 60
wait 5
set r_mode 0
set r_width 1280
set r_height 720
vid_restart
wait 40
ui_screen settings:0
wait 30
ui_mouse 0.5 0.6 wheel 40
wait 20
screenshot gfx_1280_user_0.png
wait 2
ui_mouse 0.5 0.6 wheel -6
wait 20
screenshot gfx_1280_user_1.png
wait 2
ui_mouse 0.5 0.6 wheel -6
wait 20
screenshot gfx_1280_user_2.png
wait 2
ui_mouse 0.5 0.6 wheel -6
wait 20
screenshot gfx_1280_user_3.png
wait 2
ui_mouse 0.5 0.6 wheel -6
wait 20
screenshot gfx_1280_user_4.png
wait 2
ui_screen close
wait 5
set r_width 2560
set r_height 1080
vid_restart
wait 40
ui_screen settings:0
wait 30
ui_mouse 0.5 0.6 wheel 80
wait 30
screenshot gfx_2560_normal_0.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 30
screenshot gfx_2560_normal_1.png
wait 2
ui_screen close
wait 5
set r_width 1024
set r_height 768
vid_restart
wait 40
ui_screen settings:0
wait 30
ui_mouse 0.5 0.6 wheel 80
wait 30
screenshot gfx_1024_normal_0.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 30
screenshot gfx_1024_normal_1.png
wait 2
ui_screen close
wait 5
quit
