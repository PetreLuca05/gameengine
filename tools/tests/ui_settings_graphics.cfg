// Settings > Graphics sub-tabs (docs/UI.md "Settings > Graphics"): Normal scrolled through with
// developer 0 (no Debug sub-tab) and developer 1, then Debug scrolled through; at 1920x1080 and
// 1280x720. Then Overall quality -> the simple options, a simple option -> Custom.
wait 60
time_pause 1
time_set 13:00
set r_maxfps 60
set r_mode 0
set r_width 1920
set r_height 1080
vid_restart
wait 40
set developer 0
ui_screen settings:normal
wait 30
screenshot gfx_1920_user_0.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_user_1.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_user_2.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_user_3.png
wait 2
ui_screen close
wait 5
set developer 1
ui_screen settings:normal
wait 30
ui_mouse 0.5 0.6 wheel 40
wait 20
screenshot gfx_1920_dev_normal_0.png
wait 2
ui_screen settings:debug
wait 30
ui_mouse 0.5 0.6 wheel 80
wait 20
screenshot gfx_1920_debug_0.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_debug_1.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_debug_2.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_debug_3.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_debug_4.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_debug_5.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_debug_6.png
wait 2
ui_mouse 0.5 0.6 wheel -8
wait 20
screenshot gfx_1920_debug_7.png
wait 2
ui_screen close
wait 5
// Overall quality Medium: the simple options follow; one simple change reads Custom.
set r_fidelity 2
wait 5
ui_screen settings:normal
wait 30
ui_mouse 0.5 0.6 wheel 40
wait 10
ui_mouse 0.5 0.6 wheel -9
wait 20
screenshot gfx_1920_medium.png
wait 2
set r_shadow_resolution 0
wait 10
screenshot gfx_1920_medium_custom.png
wait 2
ui_screen close
wait 5
