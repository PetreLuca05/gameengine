// Vehicle networking (docs/VEHICLES.md): the host spawns a car; a client (vehicle_net.sh, 80 ms
// fake lag) drives it (local prediction + reconciliation); both dump the vehicle at the end.
wait 60
set r_maxfps 60
time_pause 1
time_set 12:00 instant
setpos -100 0.05 40 0 0
wait 10
spawn_vehicle car 8
wait 300
vehicle_put 1 0
wait 1200
vehicle_dump
wait 120
quit
