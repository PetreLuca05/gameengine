// Vehicles (docs/VEHICLES.md): the in-game tests on the host (vehicle_test, src/game/game_vehicles.c)
// on open ground west of the dev room, then screenshots of the vehicle yard.
wait 60
set r_maxfps 60
set r_motion_blur 0
time_pause 1
time_set 12:00
setpos -100 0.05 40 0 0
wait 20
vehicle_test enter
wait 700
vehicle_test enter_moto
wait 600
vehicle_test glue
wait 320
vehicle_test glue_moto
wait 320
vehicle_test clamp
wait 80
vehicle_test fuel
wait 1520
setpos -100 0.05 40 0 0
wait 20
vehicle_test tires
wait 420
setpos -100 0.05 40 0 0
wait 20
vehicle_test drive
wait 880
setpos -100 0.05 40 0 0
wait 20
vehicle_test drive_moto
wait 880
setpos -100 0.05 40 0 0
wait 20
vehicle_test zombies
wait 720
quit
