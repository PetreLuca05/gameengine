// Vista locked frames (docs/CHAPTER_01.md §5, docs/STORY.md "Tests"): SOFA and BALCONY at dawn, noon,
// in the smoke haze and at night (city window lights). Feet at y 30 (eye 31.65); compass bearing b is
// yaw -b; cl_fov 60 vertical (91.5 deg horizontal at 16:9). The HUD is off and the frame step fixed
// (dev_fixed_fps) so captures repeat. tools/tests/vista_check.py diffs them against the goldens in
// docs/story/ch01/frames (--update rewrites the goldens). Run from build/bin:
//   ./deadground --test --nosound --log <log> --script ../../tools/tests/vista_frames.cfg
//   python ../../tools/tests/vista_check.py .
r_maxfps 60
dev_fixed_fps 60
cl_fov 60
cl_showfps 0
hud_compass 0
hud_coords 0
hud_killcount 0
hud_killfeed 0
map story_01
wait 10
weather_lock 1
weather_set clear 0
time_pause 1
time_set 06:05 instant
// Settle first (the spawn, the teleport smoothing, auto exposure), then place the camera again.
setpos 9.4 30 3.6 -25 -4
wait 30
setpos 9.4 30 3.6 -25 -4
wait 20
screenshot vista_sofa_dawn.png
wait 2
setpos 12.9 30 -0.9 -35 -6
wait 10
screenshot vista_balcony_dawn.png
wait 2
time_set 12:00 instant
wait 10
screenshot vista_balcony_noon.png
wait 2
setpos 9.4 30 3.6 -25 -4
wait 10
screenshot vista_sofa_noon.png
wait 2
weather_set cloudy+fog 0
wait 10
screenshot vista_sofa_haze.png
wait 2
setpos 12.9 30 -0.9 -35 -6
wait 10
screenshot vista_balcony_haze.png
wait 2
weather_set clear 0
time_set 22:30 instant
wait 10
screenshot vista_balcony_night.png
wait 2
setpos 9.4 30 3.6 -25 -4
wait 10
screenshot vista_sofa_night.png
wait 2
quit
