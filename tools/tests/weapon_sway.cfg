// Weapon sway (docs/RECOIL.md "Weapon sway"): hip sway is visible, ADS sway is smaller and keeps
// the reticle centre within 1 px of the aim over 600 ticks of walking + mouse movement, hold breath
// steadies it. Generated by hand from the loop below; rerun after tuning (sight_test sway / recoil).
wait 90
time_pause 1
time_set 13:00 instant
set r_motion_blur 0
set r_maxfps 60
give rifle
give pistol
wait 5
// ---- rifle + none
slot 1
setpos 0 0.05 40 0 0
wait 20
attach optic none
wait 20
echo SWAYCASE rifle none
sight_test sway
+forward
