// Weather (docs/WEATHER.md): headless checks (indoor probes, lens droplet sim, surface rates,
// replicated state) then screenshots of the weather yard (west of the dev room) in every preset:
// clouds / light, rain streaks + splashes + wet surfaces + puddles, storm lightning, fog, snow
// cover, blizzard; the low-quality (post preset 0) pipeline; GPU timings.
wait 60
set r_maxfps 60
set r_motion_blur 0
time_pause 1
time_set 13:00
weather_test indoor
weather_test drops
weather_test rates
weather_test dump
setpos -50 0.05 34 0 2
wait 30
weather_set clear 0
weather_surface 0 0 0
wait 40
screenshot C:/C/Game/build/shots/wx_clear.png
wait 2
weather_set cloudy 0
wait 40
screenshot C:/C/Game/build/shots/wx_cloudy.png
wait 2
weather_set overcast 0
wait 40
screenshot C:/C/Game/build/shots/wx_overcast.png
wait 2
weather_set rain 0
weather_surface 1 0.85 0
wait 60
screenshot C:/C/Game/build/shots/wx_rain.png
wait 2
setang 0 -25
wait 20
screenshot C:/C/Game/build/shots/wx_rain_ground.png
wait 2
setang 0 35
wait 90
screenshot C:/C/Game/build/shots/wx_rain_lens.png
wait 2
setang 0 2
weather_test frames
wait 130
weather_set storm 0
wait 60
screenshot C:/C/Game/build/shots/wx_storm.png
wait 2
weather_debug 1
wait 5
screenshot C:/C/Game/build/shots/wx_storm_debug.png
wait 2
weather_debug 0
weather_set fog 0
weather_surface 0.3 0 0
wait 60
screenshot C:/C/Game/build/shots/wx_fog.png
wait 2
weather_set snow 0
weather_surface 0 0 0.9
wait 60
screenshot C:/C/Game/build/shots/wx_snow.png
wait 2
weather_set blizzard 0
wait 60
screenshot C:/C/Game/build/shots/wx_blizzard.png
wait 2
// Under the shelter in the rain: no streaks below the roof, dry floor.
weather_set rain 0
weather_surface 1 0.85 0
setpos -50 0.05 21.5 0 -10
wait 60
screenshot C:/C/Game/build/shots/wx_shelter.png
wait 2
// Low quality pipeline (post preset 0, an older-era budget).
setpos -50 0.05 34 0 2
set r_post_preset 0
wait 60
screenshot C:/C/Game/build/shots/wx_rain_low.png
wait 2
weather_test frames
wait 130
set r_post_preset 2
weather_params
quit
