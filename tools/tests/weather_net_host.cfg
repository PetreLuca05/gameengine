// Weather replication (docs/WEATHER.md): the host changes the weather, a client joins late
// (tools/tests/weather_net.sh) and must evaluate the same parameters at the same server ticks.
wait 60
set r_maxfps 60
weather_set storm 30
weather_surface 0.6 0.3 0
wait 900
weather_test dump
weather_params
weather_set snow 0
wait 300
weather_test dump
wait 200
quit
