// Foliage wind (docs/FOLIAGE_WIND.md): the Tree It grove + procedural grass in the devroom foliage yard
// under an overridden gusty wind; every r_foliage_wind tier (fidelity: Off/Low main, Medium + detail,
// High/Modern + flutter + normals), the debug views (channels, bend), wind_debug, the tuning panel, a
// triggered gust front, a blast, slow motion. Run from build/bin with --validation: > 300 frames, 0
// messages expected; the screenshots land in build/bin.
r_maxfps 60
wait 30
foliage_test_scatter 30000
foliage_grove
wait 30
setpos 220 0.05 112 180 2
wind_speed 12
wind_dir 90
wind_gust 0.7
wait 60
r_foliage_wind 0
wait 20
screenshot wind_tier0.png
wait 3
r_foliage_wind 1
wait 20
screenshot wind_tier1.png
wait 3
r_foliage_wind 2
wait 20
screenshot wind_tier2.png
wait 3
r_foliage_wind 3
wait 20
screenshot wind_tier3.png
wait 3
wind_view 1
wait 5
screenshot wind_channels.png
wait 3
wind_view 2
wait 5
screenshot wind_bend.png
wait 3
wind_view 0
wind_debug 1
wind_gust_now 20
wait 40
wind_info
screenshot wind_debug_gust.png
wait 3
wind_debug 0
wind_blast 25 30
wait 10
wind_timescale 0.2
wait 30
wind_panel 1
wait 5
screenshot wind_panel.png
wait 3
wind_panel 0
wind_timescale 1
wait 60
foliage_stats
quit
