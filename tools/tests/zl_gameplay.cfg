// Open-world gameplay checks (docs/ZOMBIE_MAP.md): POI zombie spawner + sense radius, enterable
// buildings, deep water push-back, the map edge. Run from build/bin with --log and read the log.
set r_maxfps 60
map zombieland
wait 30
time_set 12:00
time_pause
set cl_camera_socket 0
set cl_fp_body 0
// ---- clinic (Main City): outside the door, then inside the ground floor
setpos -114 15.2 -66 0 -2
wait 120
screenshot zl_g_clinic_door.png
wait 2
setpos -110 15.2 -84 160 -5
wait 90
screenshot zl_g_clinic_inside.png
wait 2
// ---- clinic stairs: walk up the first flight (floor 1 is 3.2 m up)
setpos -91.95 15.2 -92.2 180 0
wait 30
getpos
+forward
wait 75
-forward
wait 30
getpos
screenshot zl_g_clinic_floor1.png
wait 2
// ---- zombies: stand in the city avenue for 15 s
setpos 40 16.5 -135 -90 0
wait 900
ow_stats
horde_stats
screenshot zl_g_city_zombies.png
wait 2
setang 90 0
wait 3
screenshot zl_g_city_zombies2.png
wait 600
ow_stats
screenshot zl_g_city_zombies3.png
wait 2
// ---- deep water: walk into the lake
setpos -100 14 -470 0 0
wait 60
ow_where
setpos -100 14 -600 0 0
wait 150
getpos
ow_where
// ---- the map edge (west wall at x = -1000): walk west for 4 s
setpos -960 230 200 90 0
wait 300
getpos
+forward
wait 240
-forward
getpos
// ---- police station front (locked armory inside)
setpos 114 15.5 -150 0 -3
wait 120
screenshot zl_g_police.png
wait 2
ow_stats
quit
