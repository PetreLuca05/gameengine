// Open-world perf (docs/ZOMBIE_MAP.md "Performance"): GPU pass timings at representative spots,
// uncapped. Run from build/bin with --log; read the post_bench lines.
set r_maxfps 0
set r_vsync 0
map zombieland
wait 30
time_set 11:30
time_pause
set ow_zombies 0
set cl_camera_socket 0
wait 120
// city street, eye level
setpos 40 16.5 -135 -90 0
wait 120
post_bench 200 city_street
wait 260
// suburbs, eye level in the grass
setpos -600 17 -60 -60 -3
wait 120
post_bench 200 suburbs
wait 260
// forest, eye level
setpos -60 18 640 180 0
wait 120
post_bench 200 forest
wait 260
// over the city
setpos 0 95 180 0 -28
wait 1
noclip
wait 120
post_bench 200 city_air
wait 260
// high overview
setpos -600 420 1150 0 -32
wait 120
post_bench 200 overview
wait 260
ow_stats
quit
