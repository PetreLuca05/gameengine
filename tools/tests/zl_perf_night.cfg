// Open-world perf at night (lamps and their shadows): uncapped, read post_bench / ow_stats.
set r_maxfps 0
set r_vsync 0
map zombieland
wait 30
time_set 22:40
time_pause
set ow_zombies 0
set cl_camera_socket 0
wait 120
setpos 40 16.5 -135 -90 0
wait 240
post_bench 200 night_city
wait 260
ow_stats
setpos 190 17 -200 0 -4
wait 240
post_bench 200 night_fuel
wait 260
ow_stats
quit
