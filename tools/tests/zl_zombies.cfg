// Open-world zombies (docs/ZOMBIE_MAP.md "Gameplay"): let the POI spawner fill the city around the
// player, then look down from 30 m; fire a shot (noise aggro) and watch them come.
set r_maxfps 60
map zombieland
wait 30
time_set 12:00
time_pause
set cl_camera_socket 0
set cl_fp_body 0
give pistol
setpos 40 16.5 -135 -90 0
wait 900
ow_stats
ow_zombie_list
setpos 40 45 -135 -90 -60
wait 1
noclip
wait 30
screenshot zl_z_city_above.png
wait 2
noclip
setpos 40 16.5 -135 -90 0
wait 60
+attack
wait 2
-attack
wait 240
ow_stats
setang 90 0
wait 2
screenshot zl_z_city_aggro.png
wait 2
// a ring of zombies on the suburb street (terrain + road ribbon placement)
noclip
setpos -600 17 -60 -60 -3
wait 30
spawn_horde 12 14 ring mixed
wait 180
screenshot zl_z_ring.png
wait 2
quit
